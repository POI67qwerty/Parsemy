<!doctype html>
<html lang="ja">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
        <title>パース定規グリッド（視点設定＋定規描画）</title>

        <link rel="stylesheet" href="style.css" />
        <link rel="stylesheet" href="studio.css" />
    </head>
    <body>
        <div id="side"></div>
        <div id="main">
            <div id="bar">
                <div class="brand">
                    <div class="brandText">CITY GRID<small>compact studio</small></div>
                </div>
                <div class="barGroup">
                    <button id="tg" title="設定パネルを開閉">設定</button><button id="mV" class="on">視点</button
                    ><button id="mD" class="toolIconButton" title="描画" aria-label="描画">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M4 20l3.7-.8L19.2 7.7a2.2 2.2 0 0 0-3.1-3.1L4.6 16.7 4 20Z" />
                            <path d="m14.8 5.8 3.4 3.4" />
                            <path d="M4.2 16.5 7.5 19.8" />
                        </svg>
                    </button>
                </div>
                <div class="barGroup" id="standardViews">
                    <button id="floorViewCenter" title="前／後／上／下／右／左の表示位置だけを、選択中のオブジェクトの中央へ寄せます（カメラ＝3D視点は動かしません）">表示中央へ</button
                    ><button id="viewFloorFront" title="7：間取り（正面）">7 前</button
                    ><button id="viewFloorBack" title="後から見る">後</button
                    ><button id="viewFloorTop" title="9：上から見る">9 上</button
                    ><button id="viewFloorBottom" title="下から見る">下</button
                    ><button id="viewFloorSide" title="8：右から見る">8 右</button
                    ><button id="viewFloorLeft" title="左から見る">左</button
                    ><button id="viewHome" title="0：元の視点">0 3D</button>
                </div>

                <div class="barGroup">
                    <button id="tE" class="toolBtn toolIconButton" title="消去" aria-label="消去">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path
                                d="m3.8 15.4 8.9-8.9a2.1 2.1 0 0 1 3 0l5.8 5.8a2.1 2.1 0 0 1 0 3l-4.9 4.9H8.1l-4.3-4.3a.35.35 0 0 1 0-.5Z"
                            />
                            <path d="m13.2 20.2 5.3-5.3" />
                            <path d="M7.4 11.8 12 16.4" />
                        </svg></button
                    ><button id="tM" class="toolBtn">編集</button
                    ><button id="assetToggle" class="toolBtn" title="アセット棚を開く">＋</button
                    ><button id="sceneDeleteButton" class="toolBtn" title="選択中オブジェクトを消去" aria-label="消去">
                        消去</button
                    ><button id="surfaceToggle" class="toolBtn" title="画像全体の面表示と背面処理を切り替え">
                        面 OFF
                    </button
                    ><button
                        id="lockSel"
                        class="toolBtn lockBtn"
                        title="選択中のオブジェクトをロック／解除（⌘/Ctrl+L）"
                    >
                        <svg class="lockIcon" viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="5" y="10.5" width="14" height="10" rx="2.4" />
                            <path class="lockShackle" d="M8.4 10.5V8a3.6 3.6 0 0 1 7.2 0v2.5" />
                        </svg>
                        <span class="lockText">ロック</span></button
                    ><button
                        id="lockCam"
                        class="toolBtn lockBtn"
                        title="カメラ（視点）を固定して誤操作を防ぐ（L）"
                    >
                        <svg class="lockIcon" viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="5" y="10.5" width="14" height="10" rx="2.4" />
                            <path class="lockShackle" d="M8.4 10.5V8a3.6 3.6 0 0 1 7.2 0v2.5" />
                        </svg>
                        <span class="lockText">カメラ固定</span>
                    </button>
                </div>
                <div class="barGroup" id="visibilityTools">
                    <button id="isolateSelection" class="toolBtn" aria-pressed="false" title="選択以外を一時的に非表示。もう一度押すと元の表示状態に戻します">選択以外を非表示</button>
                </div>
                <span class="barGrow"></span>
                <div class="barGroup">
                    <button id="undo" class="iconBtn" title="元に戻す (⌘/Ctrl+Z)">↶</button
                    ><button id="redo" class="iconBtn" title="やり直す (⌘/Ctrl+Y)">↷</button
                    ><button id="zr" title="ズームを100%に戻す">100%</button><button id="vendingCenterBtn" hidden title="自販機の商品窓を本体の左右中央に揃えます">中央に揃える</button
                    ><button id="clr" class="warnBtn">全消去</button>
                </div>
                <div class="barGroup">
                    <button id="exportToggle">出力⌄</button>
                    <div id="exportMenu" class="exportMenu">
                        <button id="pngB">描画＋補助線 PNG（透過）</button
                        ><button id="pngL">描画のみ PNG（透過）</button><button id="pngG">補助線のみ PNG（透過）</button
                        ><button id="pngBH">描画＋補助線 PNG（背面処理・裏面非表示）</button
                        ><button id="pngLH">描画のみ PNG（背面処理・裏面非表示）</button
                        ><button id="pngGH">補助線のみ PNG（背面処理）</button
                        ><button id="cpyL">線画（透過）をクリップボードにコピー</button
                        ><button id="cpyLH">線画（透過・背面処理）をクリップボードにコピー</button
                        ><button id="cpyG">補助線（透過）をクリップボードにコピー</button
                        ><button id="cpyB">描画＋補助線（透過）をクリップボードにコピー</button>
                    </div>
                    <button id="svP" class="saveBtn">保存</button><button id="opP">開く</button
                    ><input type="file" id="opF" accept=".json,application/json" hidden /><button
                        id="helpToggle"
                        class="iconBtn"
                        title="操作ヘルプ"
                    >
                        ?
                    </button>
                </div>
            </div>
            <div id="stage"><canvas id="cv"></canvas></div>
            <div id="hint" class="note" style="padding: 4px 10px"></div>
        </div>

        <script src="engine-lib.js"></script>
        <script src="engine-core.js"></script>
        <script src="engine-gizmo.js"></script>
        <script src="engine-render.js"></script>
        <script src="engine-input.js"></script>
        <script src="engine-io.js"></script>
        <script src="asset.js"></script>
        <script src="asset-kit.js"></script>
    <script src="asset-kit-parts.js"></script>
        <script src="asset-kit-assets.js"></script>
        <script src="asset-controller.js"></script>
        <script src="studio-lib.js"></script>
        <script src="studio-canvas-controls.js"></script>
        <script src="studio-ui.js"></script>
        <script src="studio-floorplan.js"></script>
    </body>
</html>
