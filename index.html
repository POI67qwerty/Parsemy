<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
	<title>パース定規グリッド（視点設定＋定規描画）</title>

	<!-- Split build stylesheet: all visual rules live in style.css. -->
	<link rel="stylesheet" href="style.css">
</head>

<body>
	<!-- Left settings / scene panel. JavaScript fills this panel at startup. -->
	<div id="side"></div>
	<!-- Main application area: toolbar, canvas, and status hint. -->
	<div id="main">
		<div id="bar">
			<div class="brand">
				<div class="brandMark">◈</div>
				<div class="brandText">CITY GRID STUDIO<small>perspective helper / v2</small></div>
			</div>
			<div class="barGroup"><button id="tg" title="設定パネルを開閉">設定</button><button id="mV"
					class="on">視点</button><button id="mD">描画</button></div>
			<div class="barGroup"><button id="tE" class="toolBtn">消す</button><button id="tS"
					class="toolBtn">図形</button><button id="tM" class="toolBtn">編集</button><button id="tB"
					class="toolBtn">範囲</button><button id="assetToggle" class="toolBtn">＋アセット</button></div>
			<div class="barGroup" id="standardViews"><button id="viewFloorSide" title="8：間取り（真横）">8 間取り横</button><button
					id="viewFloorTop" title="9：間取り（真上）">9 間取り</button><button id="viewHome" title="0：元の視点">0
					元の視点</button></div>
			<span class="barGrow"></span>
			<div class="barGroup"><button id="undo" class="iconBtn" title="元に戻す (⌘/Ctrl+Z)">↶</button><button id="redo"
					class="iconBtn" title="やり直す (⌘/Ctrl+Y)">↷</button><button id="zr"
					title="ズームを100%に戻す">100%</button><button id="clr" class="warnBtn">消去</button></div>
			<div class="barGroup"><button id="exportToggle">書き出し⌄</button>
				<div id="exportMenu" class="exportMenu">
					<button id="pngB">描画＋補助線 PNG（透過）</button><button id="pngL">描画のみ PNG（透過）</button><button
						id="pngG">補助線のみ
						PNG（透過）</button><button id="pngBH">描画＋補助線 PNG（背面処理・裏面非表示）</button><button id="pngLH">描画のみ
						PNG（背面処理・裏面非表示）</button><button id="pngGH">補助線のみ PNG（背面処理）</button><button
						id="cpyL">線画をクリップボードにコピー</button>
				</div><button id="svP" class="saveBtn">保存</button><button id="opP">開く</button><input type="file"
					id="opF" accept=".json,application/json" hidden><button id="helpToggle" class="iconBtn"
					title="操作ヘルプ">?</button>
			</div>
		</div>
		<!-- Drawing stage. The canvas is the only drawing surface. -->
		<div id="stage"><canvas id="cv"></canvas></div>
		<div id="hint" class="note" style="padding:4px 10px"></div>
	</div>
	<!-- Split build: the stable rendering engine is separated from the compact studio UI layer. -->
	<script src="engine.js"></script>
	<script src="studio-ui.js"></script>

</body>

</html>
