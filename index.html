<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
	<title>パース定規グリッド（視点設定＋定規描画）</title>

	<!-- Split build stylesheet: all visual rules live in style.css. -->
	<link rel="stylesheet" href="style.css">
</head>

<body>
	<div id="side"></div>
	<div id="main">
		<div id="bar">
			<div class="brand">
				<div class="brandMark">◈</div>
				<div class="brandText">CITY GRID<small>compact studio</small></div>
			</div>
			<div class="barGroup"><button id="tg" title="設定パネルを開閉">設定</button><button id="mV"
					class="on">視点</button><button id="mD">描画</button></div>
			<div class="barGroup"><button id="tE" class="toolBtn">消去</button><button id="tS"
					class="toolBtn">図形</button><button id="tM" class="toolBtn">編集</button><button id="tB"
					class="toolBtn">範囲</button><button id="assetToggle" class="toolBtn" title="アセット棚を開く">＋</button>
			</div>
			<div class="barGroup" id="standardViews"><button id="viewFloorSide" title="8：間取り（真横）">8 横</button><button
					id="viewFloorTop" title="9：間取り（真上）">9 上</button><button id="viewHome" title="0：元の視点">0 3D</button>
			</div>
			<span class="barGrow"></span>
			<div class="barGroup"><button id="undo" class="iconBtn" title="元に戻す (⌘/Ctrl+Z)">↶</button><button id="redo"
					class="iconBtn" title="やり直す (⌘/Ctrl+Y)">↷</button><button id="zr"
					title="ズームを100%に戻す">100%</button><button id="clr" class="warnBtn">全消去</button></div>
			<div class="barGroup"><button id="exportToggle">出力⌄</button>
				<div id="exportMenu" class="exportMenu">
					<button id="pngB">描画＋補助線 PNG（透過）</button><button id="pngL">描画のみ PNG（透過）</button><button
						id="pngG">補助線のみ PNG（透過）</button><button id="pngBH">描画＋補助線 PNG（背面処理・裏面非表示）</button><button
						id="pngLH">描画のみ PNG（背面処理・裏面非表示）</button><button id="pngGH">補助線のみ PNG（背面処理）</button><button
						id="cpyL">線画をクリップボードにコピー</button>
				</div><button id="svP" class="saveBtn">保存</button><button id="opP">開く</button><input type="file"
					id="opF" accept=".json,application/json" hidden><button id="helpToggle" class="iconBtn"
					title="操作ヘルプ">?</button>
			</div>
		</div>
		<div id="stage"><canvas id="cv"></canvas></div>
		<div id="hint" class="note" style="padding:4px 10px"></div>
	</div>

	<!-- Split build: the stable rendering engine is separated from the compact studio UI layer. -->
	<script src="engine.js"></script>
	<script src="studio-ui.js"></script>
	<script type="module"
		src="https://static.cloudflareinsights.com/beacon.min.js/vce701823e78c4301a35b7e07294d87301792088814092"
		integrity="sha512-UKNk8GbxkABxKcXYuLkO16EleLGUkcvJWtpSNmExE0Too3ZaFAxTscNWEc1OdAv5/BikHawapSCaiD2XCmp+Bw=="
		data-cf-beacon='{"version":"2024.11.0","token":"1954b47c125f43f8b4338b3c4f804e4f","spa":2}'
		crossorigin="anonymous"></script>
</body>

</html>
