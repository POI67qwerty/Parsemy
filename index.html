<!doctype html>
<html lang="ja">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
        <title>パース定規グリッド（視点設定＋定規描画）</title>

        <link rel="stylesheet" href="style.css" />
        <link rel="stylesheet" href="studio.css" />
    </head>
    <body>
        <div id="side"></div>
        <div id="main">
            <div id="bar">
                <div class="brand">
                    <div class="brandMark">◈</div>
                    <div class="brandText">CITY GRID<small>compact studio</small></div>
                </div>
                <div class="barGroup">
                    <button id="tg" title="設定パネルを開閉">設定</button><button id="mV" class="on">視点</button
                    ><button id="mD" class="toolIconButton" title="描画" aria-label="描画">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M4 20l3.7-.8L19.2 7.7a2.2 2.2 0 0 0-3.1-3.1L4.6 16.7 4 20Z" />
                            <path d="m14.8 5.8 3.4 3.4" />
                            <path d="M4.2 16.5 7.5 19.8" />
                        </svg>
                    </button>
                </div>
                <div class="barGroup">
                    <button id="tE" class="toolBtn toolIconButton" title="消去" aria-label="消去">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path
                                d="m3.8 15.4 8.9-8.9a2.1 2.1 0 0 1 3 0l5.8 5.8a2.1 2.1 0 0 1 0 3l-4.9 4.9H8.1l-4.3-4.3a.35.35 0 0 1 0-.5Z"
                            />
                            <path d="m13.2 20.2 5.3-5.3" />
                            <path d="M7.4 11.8 12 16.4" />
                        </svg></button
                    ><button id="tM" class="toolBtn">編集</button><button id="tB" class="toolBtn">範囲</button
                    ><button id="assetToggle" class="toolBtn" title="アセット棚を開く">＋</button
                    ><button id="sceneDeleteButton" class="toolBtn" title="選択中オブジェクトを消去" aria-label="消去">
                        消去</button
                    ><button id="surfaceToggle" class="toolBtn" title="画像全体の面表示と背面処理を切り替え">
                        面 OFF
                    </button>
                </div>
                <div class="barGroup" id="standardViews">
                    <button id="viewFloorFront" title="7：間取り（正面）">7 前</button
                    ><button id="viewFloorSide" title="8：間取り（真横）">8 横</button
                    ><button id="viewFloorTop" title="9：間取り（真上）">9 上</button
                    ><button id="viewHome" title="0：元の視点">0 3D</button>
                </div>
                <span class="barGrow"></span>
                <div class="barGroup">
                    <button id="undo" class="iconBtn" title="元に戻す (⌘/Ctrl+Z)">↶</button
                    ><button id="redo" class="iconBtn" title="やり直す (⌘/Ctrl+Y)">↷</button
                    ><button id="zr" title="ズームを100%に戻す">100%</button
                    ><button id="clr" class="warnBtn">全消去</button>
                </div>
                <div class="barGroup">
                    <button id="exportToggle">出力⌄</button>
                    <div id="exportMenu" class="exportMenu">
                        <button id="pngB">描画＋補助線 PNG（透過）</button
                        ><button id="pngL">描画のみ PNG（透過）</button><button id="pngG">補助線のみ PNG（透過）</button
                        ><button id="pngBH">描画＋補助線 PNG（背面処理・裏面非表示）</button
                        ><button id="pngLH">描画のみ PNG（背面処理・裏面非表示）</button
                        ><button id="pngGH">補助線のみ PNG（背面処理）</button
                        ><button id="cpyL">線画（透過）をクリップボードにコピー</button
                        ><button id="cpyG">補助線（透過）をクリップボードにコピー</button
                        ><button id="cpyB">描画＋補助線（透過）をクリップボードにコピー</button>
                    </div>
                    <button id="svP" class="saveBtn">保存</button><button id="opP">開く</button
                    ><input type="file" id="opF" accept=".json,application/json" hidden /><button
                        id="helpToggle"
                        class="iconBtn"
                        title="操作ヘルプ"
                    >
                        ?
                    </button>
                </div>
            </div>
            <div id="stage"><canvas id="cv"></canvas></div>
            <div id="hint" class="note" style="padding: 4px 10px"></div>
        </div>

        <script src="engine-core.js"></script>
        <script src="engine-tools.js"></script>
        <script src="asset.js"></script>
        <script src="asset-controller.js"></script>
        <script src="studio-ui.js"></script>

</html>
