            kneeX = [-0.11 * h * legSpread, 0.11 * h * legSpread];
        }
        // 足元の小さな台座と脚。歩幅・しゃがみ量・脚の開きを連続的に反映する。
        out.push(...boxA(o, leg * 1.5, bd * 0.85, 0, 0.08 * h, c));
        if (pose === "sit") {
            out.push(
                lineA(
                    o,
                    [
                        [-0.09 * h * legSpread, bodyY, 0.32 * h],
                        [kneeX[0], kneeY[0], 0.3 * h],
                        [kneeX[0], footY[0], 0],
                    ],
                    c,
                    1.4,
                ),
            );
            out.push(
                lineA(
                    o,
                    [
                        [0.09 * h * legSpread, bodyY, 0.32 * h],
                        [kneeX[1], kneeY[1], 0.3 * h],
                        [kneeX[1], footY[1], 0],
                    ],
                    c,
                    1.4,
                ),
            );
        } else {
            out.push(
                lineA(
                    o,
                    [
                        [kneeX[0], footY[0], 0],
                        [kneeX[0], kneeY[0], legTop],
                    ],
                    c,
                    1.4,
                ),
            );
            out.push(
                lineA(
                    o,
                    [
                        [kneeX[1], footY[1], 0],
                        [kneeX[1], kneeY[1], legTop],
                    ],
                    c,
                    1.4,
                ),
            );
        }
        // Torso and shoulders. leanは肩・首・頭の位置へ反映する。
        out.push(...boxA(o, bw, bd, torso0, torso1, c));
        out.push(
            lineA(
                o,
                [
                    [-bw * 0.48, bodyY, torso1 - 0.02 * h],
                    [bw * 0.48, bodyY, torso1 - 0.02 * h],
                ],
                a,
                1,
            ),
        );
        // 腕は省略。小さな人物シルエットとして使えるよう胴体と脚だけ残す。
        // Head rings are shifted/tilted without adding arms.
        const ringAt = (rx, ry, x0, y0, z, n, color) => {
            const pts = [];
            for (let i = 0; i < n; i++) {
                const t = (i / n) * Math.PI * 2;
                pts.push([x0 + rx * Math.cos(t), y0 + ry * Math.sin(t), z]);
            }
            return polyA(o, pts, color);
        };
        out.push(
            lineA(
                o,
                [
                    [0, bodyY, torso1],
                    [headTopX, headY, head0],
                ],
                c,
                1.1,
            ),
        );
        out.push(ringAt(headR, headR * 0.9, 0, headY, head0, 8, c));
        out.push(ringAt(headR * 0.86, headR * 0.78, headTopX, headY + 0.02 * h, head1, 8, c));
        for (let i = 0; i < 8; i++) {
            const t = (i / 8) * Math.PI * 2;
            out.push(
                lineA(
                    o,
                    [
                        [headR * Math.cos(t), headY + headR * 0.9 * Math.sin(t), head0],
                        [headTopX + headR * 0.86 * Math.cos(t), headY + 0.02 * h + headR * 0.78 * Math.sin(t), head1],
                    ],
                    c,
                    0.85,
                ),
            );
        }
        // A small measurement tick makes the current pose height reference visible.
        const mx = 0.42 * h;
        out.push(
            lineA(
                o,
                [
                    [mx, 0, 0],
                    [mx, 0, poseTop],
                ],
                a,
                0.75,
            ),
        );
        out.push(
            lineA(
                o,
                [
                    [mx - 0.045 * h, 0, 0],
                    [mx + 0.045 * h, 0, 0],
                ],
                a,
                0.75,
            ),
        );
        out.push(
            lineA(
                o,
                [
                    [mx - 0.045 * h, 0, poseTop],
                    [mx + 0.045 * h, 0, poseTop],
                ],
                a,
                0.75,
            ),
        );
        // --- 開口のある建物 ---
        // 外枠に加え、開口の左右柱・上梁・内側面・奥面を描く。
    } else if (kind === "building") {
        // チェックを外したリンク建物は、開口のない通常の閉じた箱へ戻す。
        if (o.openingEnabled === false) return closedBuildingLines(o, w, d, h, c);
        // 外側は直方体の輪郭を保ちながら、正面から背面まで抜ける開口を作る。
        // 左右の柱＋上梁として分けて描くので、開口の左右・上面・奥行きも編集対象になる。
        const bp = buildingParams(o),
            ow = bp.openingW,
            oh = bp.openingH,
            backY = bp.backY,
            side = bp.sideT,
            centerX = (ow + side) / 2;
        const outerFront = [
                [-w / 2, -d / 2, 0],
                [w / 2, -d / 2, 0],
                [w / 2, -d / 2, h],
                [-w / 2, -d / 2, h],
            ],
            outerBack = [
                [-w / 2, d / 2, 0],
                [w / 2, d / 2, 0],
                [w / 2, d / 2, h],
                [-w / 2, d / 2, h],
            ];
        out.push(polyA(o, outerFront, c));
        out.push(polyA(o, outerBack, c));
        const innerFront = [
                [-ow / 2, -d / 2, 0],
                [-ow / 2, -d / 2, oh],
                [ow / 2, -d / 2, oh],
                [ow / 2, -d / 2, 0],
            ],
            innerBack = [
                [-ow / 2, d / 2, 0],
                [-ow / 2, d / 2, oh],
                [ow / 2, d / 2, oh],
                [ow / 2, d / 2, 0],
            ],
            innerPanel = [
                [-ow / 2, backY, 0],
                [-ow / 2, backY, oh],
                [ow / 2, backY, oh],
                [ow / 2, backY, 0],
            ];
        out.push(lineA(o, innerFront, a, 1.1));
        out.push(lineA(o, innerBack, a, 1.1));
        if (Math.abs(Math.abs(backY) - d / 2) > 0.01) out.push(lineA(o, innerPanel, a, 1.1));
        // オレンジの奥面の下辺だけを、面から少し浮かせて線画として表示する。
        out.push(
            lineA(
                o,
                [
                    [-ow / 2, backY, 0.012],
                    [ow / 2, backY, 0.012],
                ],
                a,
                1.15,
            ),
        );
        [
            [-w / 2, -d / 2, 0],
            [-w / 2, d / 2, 0],
            [w / 2, -d / 2, 0],
            [w / 2, d / 2, 0],
            [-w / 2, -d / 2, h],
            [-w / 2, d / 2, h],
            [w / 2, -d / 2, h],
            [w / 2, d / 2, h],
            [-ow / 2, -d / 2, 0],
            [-ow / 2, d / 2, 0],
            [ow / 2, -d / 2, 0],
            [ow / 2, d / 2, 0],
            [-ow / 2, -d / 2, oh],
            [-ow / 2, d / 2, oh],
            [ow / 2, -d / 2, oh],
            [ow / 2, d / 2, oh],
        ].forEach((p, i, arr) => {
            if (i % 2 === 0) out.push(lineA(o, [p, arr[i + 1]], a, 1.0));
        });
        // 開口の内側面（左右・上）を明示して、面表示時にも空洞が見えるようにする。
        out.push(
            polyA(
                o,
                [
                    [-ow / 2, -d / 2, 0],
                    [-ow / 2, d / 2, 0],
                    [-ow / 2, d / 2, oh],
                    [-ow / 2, -d / 2, oh],
                ],
                a,
                1.0,
            ),
        );
        out.push(
            polyA(
                o,
                [
                    [ow / 2, -d / 2, 0],
                    [ow / 2, -d / 2, oh],
                    [ow / 2, d / 2, oh],
                    [ow / 2, d / 2, 0],
                ],
                a,
                1.0,
            ),
        );
        out.push(
            polyA(
                o,
                [
                    [-ow / 2, -d / 2, oh],
                    [ow / 2, -d / 2, oh],
                    [ow / 2, d / 2, oh],
                    [-ow / 2, d / 2, oh],
                ],
                a,
                1.0,
            ),
        );
        // --- 店舗テント ---
        // awningGeometry()が返す手前上辺・奥側・底辺をつないでテントを描く。
    } else if (kind === "awning") {
        // 店舗テント：初期状態は直方体。手前上辺だけを高さ・奥行き方向へ動かせる。
        const g = awningGeometry(o),
            x = g.w / 2,
            baseY = g.baseFrontY,
            edgeY = g.edgeY,
            backY = g.d / 2,
            frontTop = g.edgeZ,
            backTop = g.h,
            frontBottom = g.frontBottom,
            backBottom = g.backBottom;
        out.push(
            polyA(
                o,
                [
                    [-x, edgeY, frontTop],
                    [x, edgeY, frontTop],
                    [x, backY, backTop],
                    [-x, backY, backTop],
                ],
                c,
                1.1,
            ),
        );
        out.push(
            polyA(
                o,
                [
                    [-x, baseY, frontBottom],
                    [x, baseY, frontBottom],
                    [x, backY, backBottom],
                    [-x, backY, backBottom],
                ],
                a,
                1.0,
            ),
        );
        out.push(
            polyA(
                o,
                [
                    [-x, baseY, frontBottom],
                    [x, baseY, frontBottom],
                    [x, edgeY, frontTop],
                    [-x, edgeY, frontTop],
                ],
                a,
                1.0,
            ),
        );
        out.push(
            polyA(
                o,
                [
                    [-x, backY, backBottom],
                    [x, backY, backBottom],
                    [x, backY, backTop],
                    [-x, backY, backTop],
                ],
                a,
                1.0,
            ),
        );
        out.push(
            polyA(
                o,
                [
                    [-x, baseY, frontBottom],
                    [-x, backY, backBottom],
                    [-x, backY, backTop],
                    [-x, edgeY, frontTop],
                ],
                a,
                1.0,
            ),
        );
        out.push(
            polyA(
                o,
                [
                    [x, baseY, frontBottom],
                    [x, edgeY, frontTop],
                    [x, backY, backTop],
                    [x, backY, backBottom],
                ],
                a,
                1.0,
            ),
        );
    }
    return out;
}
// ===== 6. 保存データ・入力値の正規化 =====
// 描画前に、寸法の下限・ベベル値・階数・パス値などを整える。
// ここでは見た目を作らず、後段のassetLines()が安全に読める形へ変換する。
function normalizedAsset(o) {
    let q = o?.attachment ? syncAttachedPart(o) : o;
    if (q && q.asset === "beveledBox") {
        const width = Math.max(0.01, Math.abs(Number(q.ra) || 0.01) * 2),
            depth = Math.max(0.01, Math.abs(Number(q.rb) || 0.01) * 2),
            max = Math.max(0, Math.min(width, depth) * 0.5 - 0.001),
            bevelOffset = clamp(Number(q.bevelOffset) || 0, 0, max),
            bevelSegments = beveledBoxSegments(q.bevelSegments, q.bevelEdges);
        return { ...q, bevelOffset, bevelSegments, h: Math.max(0, Number(q.h) || 0) };
    }
    if (q && isStackedBuildingAsset(q)) {
        const source = Array.isArray(q.floors) && q.floors.length ? q.floors : [],
            first = source[0] || { w: Number(q.ra) * 2 || 4, d: Number(q.rb) * 2 || 3, h: 2.2, rimHeight: 0.16 },
            opening = stackedOpeningParams(q, first),
            baseOffset = Number.isFinite(Number(q.bevelOffset)) ? Number(q.bevelOffset) : 0.28,
            baseSegments = beveledBoxSegments(q.bevelSegments, q.bevelEdges),
            floors = source.map((f) => {
                const w = Math.max(0.01, Math.abs(Number(f.w) || Number(q.ra) * 2 || 4)),
                    d = Math.max(0.01, Math.abs(Number(f.d) || Number(q.rb) * 2 || 3)),
                    max = Math.max(0, Math.min(w, d) * 0.5 - 0.001),
                    offset = clamp(Number.isFinite(Number(f.bevelOffset)) ? Number(f.bevelOffset) : baseOffset, 0, max),
                    segments = beveledBoxSegments(f.bevelSegments, f.bevelEdges, baseSegments);
                return { ...f, bevelOffset: offset, bevelSegments: segments };
            });
        return {
            ...q,
            ...(q.asset === "beveledStackedBuilding" ? { bevelOffset: baseOffset, bevelSegments: baseSegments } : {}),
            openingEnabled: stackedOpeningEnabled(q),
            openingW: opening.openingW,
            openingH: opening.openingH,
            openingBack: opening.openingBack,
            floors,
            h: floors.reduce((max, f) => Math.max(max, (Number(f.z) || 0) + (Number(f.h) || 0)), 0),
        };
    }
    // パスパイプは制御点からra/rb/h（外接範囲）も再計算する。
    if (q && q.asset === "pathPipe") {
        const path = pathPipeControlPoints(q),
            radius = clamp(Number.isFinite(Number(q.pipeRadius)) ? Math.abs(Number(q.pipeRadius)) : 0.18, 0.02, 20),
            cornerRadius = clamp(
                Number.isFinite(Number(q.cornerRadius)) ? Math.abs(Number(q.cornerRadius)) : 0.55,
                0,
                20,
            ),
            pipeSides = clamp(Math.round(Number(q.pipeSides) || 10), 6, 24),
            cornerSteps = clamp(Math.round(Number(q.cornerSteps) || 6), 2, 16),
            xs = path.map((v) => v[0]),
            ys = path.map((v) => v[1]),
            zs = path.map((v) => v[2]);
        q = {
            ...q,
            path,
            pipeRadius: radius,
            cornerRadius,
            pipeSides,
            cornerSteps,
            ra: Math.max(0.1, (Math.max(...xs) - Math.min(...xs)) * 0.5 + radius),
            rb: Math.max(0.1, (Math.max(...ys) - Math.min(...ys)) * 0.5 + radius),
            h: Math.max(0.1, Math.max(...zs) - Math.min(...zs) + radius * 2),
        };
    }
    // ベランダの床厚・手すり厚・手すり高さを正規化する。
    if (q && q.asset === "balcony") {
        const floorT = clamp(Number(q.balconyFloorThickness) || 0.16, 0.04, 10),
            railT = clamp(Number(q.balconyRailThickness) || 0.12, 0.035, 10),
            railH = q.balconyRailHeightEdited
                ? clamp(Number(q.balconyRailHeight) || 0.9, 0.12, 30)
                : Math.max(0.12, (Number(q.h) || 1.25) - floorT);
        q = {
            ...q,
            balconyFloorThickness: floorT,
            balconyRailThickness: railT,
            balconyRailHeight: railH,
            h: floorT + railH,
        };
    }
    // 球は3方向の半径をそろえ、必ず真球として扱う。
    if (q && q.asset === "sphere") {
        const r = Math.max(
            0.005,
            Math.min(
                Math.abs(Number(q.ra) || 0.65),
                Math.abs(Number(q.rb) || 0.65),
                Math.abs(Number(q.h) || 1.3) * 0.5,
            ),
        );
        return { ...q, ra: r, rb: r, h: r * 2 };
    }
    // テントの編集済み手前辺を再計算し、描画とギズモで同じ値を使う。
    if (q && q.asset === "awning") {
        const g = awningGeometry(q);
        return {
            ...q,
            awningEdgeZ: g.edgeZ,
            awningEdgeY: g.edgeY,
            awningThickness: g.thickness,
            awningFrontBottom: g.frontBottom,
            awningBackBottom: g.backBottom,
        };
    }
    // 開口幅・開口高さ・奥面位置を建物本体の範囲内へ収める。
    if (q && q.asset === "building") {
        const w = Math.max(0.1, Math.abs(Number(q.ra) || 2) * 2),
            d = Math.max(0.05, Math.abs(Number(q.rb) || 0.5) * 2),
            h = Math.max(0.1, Number(q.h) || 3),
            openingW = clamp(Number(q.openingW) || w * 0.56, 0.1, Math.max(0.1, w - 0.1)),
            openingH = clamp(Number(q.openingH) || h * 0.66, 0.1, Math.max(0.1, h - 0.1)),
            n = { ...q, openingW, openingH };
        if (Number.isFinite(Number(q.openingBack)))
            n.openingBack = clamp(Number(q.openingBack), -d / 2 + 0.025, d / 2 - 0.025);
        return n;
    }
    return q;
}
// 正規化済みアセットを線画へ変換する入口。
function genAsset(o) {
    const q = normalizedAsset(o);
    return assetLines(q).map((s) => ({ ...s, ob: q, d3: true, cs: sigNow() }));
}

// ===== 7. 既存エンジンへの接続 =====
// engine-core.jsのgenShapeを置き換えず、元の関数を退避してから
// assetだけをgenAssetへ振り分ける。通常のrect/box/circは従来処理のまま。
const baseGenShape = genShape;
genShape = function (o) {
    return o && o.type === "asset" ? genAsset(o) : baseGenShape(o);
};
// アセットの外接範囲もここで計算する。
// 選択枠、間取りのヒット判定、ボックス選択、移動ギズモが同じ範囲を使う。
const baseObBounds = obBounds;
obBounds = function (o) {
    if (!o || o.type !== "asset") return baseObBounds(o);
    const q = syncAttachedPart(o),
        pts = [];
    if (q.asset === "custom" && Array.isArray(q.geometry?.vertices) && q.geometry.vertices.length) {
        q.geometry.vertices.forEach((v) => {
            if (Array.isArray(v) && v.length >= 3)
                pts.push(customPt(q, Number(v[0]) || 0, Number(v[1]) || 0, Number(v[2]) || 0));
        });
    } else if (q.asset === "wallSideSign") {
        const bracketLength = clamp(Math.abs(Number(q.wallSideSignBracketLength) || 0.36), 0.05, 5),
            clearance = 0.025,
            bracketCount = clamp(Math.round(Number(q.wallSideSignBracketCount) || 0), 0, 3),
            boardHalfHeight = Math.abs(Number(q.ra) || 0.5),
            boardHalfWidth = Math.abs(Number(q.rb) || 0.5),
            thickness = Math.max(0.02, Math.abs(Number(q.h) || 0.12)),
            y0 = bracketCount > 0 ? -boardHalfWidth - bracketLength - clearance : -boardHalfWidth,
            y1 = boardHalfWidth,
            z0 = -thickness * 0.5,
            z1 = thickness * 0.5;
        [y0, y1].forEach((y) =>
            [-boardHalfHeight, boardHalfHeight].forEach((x) => [z0, z1].forEach((z) => pts.push(pt(q, x, y, z)))),
        );
    } else if (q.asset === "pathPipe") {
        const mesh = pathPipeMesh(q);
        mesh.rings.forEach((ring) =>
            ring.forEach((v) => pts.push(pt(q, Number(v[0]) || 0, Number(v[1]) || 0, Number(v[2]) || 0))),
        );
    } else if (isStackedBuildingAsset(q)) {
        const floors =
            Array.isArray(q.floors) && q.floors.length
                ? q.floors
                : [{ x: 0, y: 0, z: 0, w: q.ra * 2 || 4, d: q.rb * 2 || 3, h: q.h || 2.2 }];
        floors.forEach((f) => {
            const w = Math.abs(Number(f.w) || 4),
                d = Math.abs(Number(f.d) || 3),
                h = Math.abs(Number(f.h) || 2.2),
                rh = Math.min(h, Math.max(0.01, Math.abs(Number(f.rimHeight) || q.rimHeight || 0.16))),
                ro = Math.max(0, Math.abs(Number(f.rimOverhang) || q.rimOverhang || 0.18)),
                add = (ww, dd, z0, z1) => {
                    [-ww / 2, ww / 2].forEach((x) =>
                        [-dd / 2, dd / 2].forEach((y) =>
                            [z0, z1].forEach((z) =>
                                pts.push(customPt(q, x + Number(f.x || 0), y + Number(f.y || 0), z + Number(f.z || 0))),
                            ),
                        ),
                    );
                };
            add(w, d, 0, h);
            add(w + ro * 2, d + ro * 2, h - rh, h);
        });
    } else {
        const hs = [0, q.h],
            xs = [-q.ra, q.ra],
            ys = [-q.rb, q.rb];
        hs.forEach((z) => xs.forEach((x) => ys.forEach((y) => pts.push(pt(q, x, y, z)))));
    }
    const lo = [Infinity, Infinity, Infinity],
        hi = [-Infinity, -Infinity, -Infinity];
    pts.forEach((v) =>
        v.forEach((n, i) => {
            lo[i] = Math.min(lo[i], n);
            hi[i] = Math.max(hi[i], n);
        }),
    );
    return { lo, hi };
};
// ===== 8. 初期化 =====
// すでに自動保存されているオブジェクトも、今回の円柱・球・看板の新しい線画へ更新する。
regenObjects();

/* City Grid Studio asset controller.
   アセットの配置・接続・JSON入出力・棚UIを担当する。

   処理の流れ
   1. newAsset             : 初期位置、生成面、寸法、固有値を持つ定義を作る
   2. placeAsset           : 線画を生成してSへ登録し、選択状態を更新する
   3. placeLinkedAsset     : 建物とテント／看板などの親子接続を作る
   4. import / clipboard   : 定義だけを保存・複製し、新しいIDで再生成する
   5. 棚UI                 : ボタン入力を上記処理へ接続する

   ギズモ操作は engine-tools.js が担当する。 */

    // 必要距離を見積もり、入力された配置距離は「最小距離」として扱う。
    const ASSET_PLACEMENT = Object.freeze({

    function assetPlacementDepth(info = null) {

            d = Math.abs(Number(info?.d) || 1),
            h = Math.abs(Number(info?.h) || 1),
            span = Math.max(w, d, h, 1),
            focal = (W * Math.max(14, Number(P.lens) || 50)) / 36,
            viewport = Math.max(240, Math.min(W, H)),
            fit = (focal * span * ASSET_PLACEMENT.margin) / (viewport * ASSET_PLACEMENT.screenFill),
            requested = Number(P.assetDepth);
        return Math.min(
            ASSET_PLACEMENT.maxDepth,
            Math.max(
                ASSET_PLACEMENT.minDepth,
                Number.isFinite(requested) ? requested : ASSET_PLACEMENT.defaultDepth,
                fit,
            ),
        );
    }
    function assetGroundPoint(info = null) {
        // アセットボタンは、ほぼ水平なレイとの遠い交点ではなく、
        // 画面内へ余白を残せる距離の地面へ配置する。
        const yaw = P.yaw * DG,
            depth = assetPlacementDepth(info),
            f = [-Math.sin(yaw), 0, Math.cos(yaw)];
        return [P.cx + f[0] * depth, -1, P.cz + f[2] * depth];
    }
    // アセット棚での1回の追加に対応する定義を作る。
    // 生成面（P.assetAxis）をkへ変換し、アセット固有の初期値もここで付ける。
    function newAsset(kind, p, worldPoint = null) {
        const info = ASSETS[kind],
            isDefault = !p && !worldPoint;
        p = p || { x: W * 0.5, y: H * 0.62 };
        let q = worldPoint || (isDefault ? assetGroundPoint(info) : groundAt(p));
        if (!q || !q.every(Number.isFinite)) q = assetGroundPoint(info);
        // Repeated clicks are fanned out slightly so a new object cannot hide exactly under the previous one.
        if (isDefault) {
            const n = sceneObjects().length,
                span = Math.max(
                    Math.abs(Number(info?.w) || 1),
                    Math.abs(Number(info?.d) || 1),
                    Math.abs(Number(info?.h) || 1),
                ),
                fan = clamp(span * 0.28, ASSET_PLACEMENT.fanMin, ASSET_PLACEMENT.fanMax);
            q = [q[0] + ((n % 4) - 1.5) * fan, q[1], q[2] + Math.floor(n / 4) * fan * 1.2];
        }
        // 生成方向は「その軸に立つ面」の法線。Y=地面、X/Z=壁面として配置する。
        const k = kind === "balcony" ? 1 : clamp(Math.round(Number(P.assetAxis ?? 1)), 0, 2),
            d = -1,
            [iu, iv] = PL[k],
            off = [0, 0, 0];
        // L2Wの基準面は d=-1 なので、選んだ点へ基準面を平行移動する。
        off[k] = q[k] - d;
        const base = {
            id: uid(),
            k,
            d,
            off,
            ca: q[iu],
            cb: q[iv],
            rot: 0,
            lift: 0,
            wf: true,
            c: el("pc").value || "#222222",
            w: MASTER_W,
            accent: info.accent,
        };
        const height = kind === "person" ? Number(P.hm) || 1.7 : info.h;
        if (kind === "stackedBuilding" || kind === "beveledStackedBuilding") {
            const beveled = kind === "beveledStackedBuilding",
                floorHeight = 2.2,
                floorGap = 0.06,
                floors = Array.from({ length: 4 }, (_, i) => ({
                    name: `${i + 1}F`,
                    x: 0,
                    y: 0,
                    z: i * (floorHeight + floorGap),
                    w: info.w,
                    d: info.d,
                    h: floorHeight,
                    rimHeight: 0.16,
                    rimOverhang: 0.18,
                    bevelOffset: beveled ? info.bevelOffset : undefined,
                    bevelSegments: beveled ? info.bevelSegments : undefined,
                }));
            return {
                ...base,
                type: "asset",
                asset: kind,
                assetId: beveled ? "beveled-stacked-building" : "stacked-building",
                assetName: info.label,
                k: 1,
                d: -1,
                off: [q[0], 0, q[2]],
                ca: 0,
                cb: 0,
                h: floors[floors.length - 1].z + floorHeight,
                ra: info.w / 2,
                rb: info.d / 2,
                floorCount: floors.length,
                floorHeight,
                floorGap,
                rimHeight: 0.16,
                rimOverhang: 0.18,
                bevelOffset: beveled ? info.bevelOffset : undefined,
                bevelSegments: beveled ? info.bevelSegments : undefined,
                openingEnabled: false,
                openingW: info.w * 0.56,
                openingH: floorHeight * 0.66,
                openingBack: info.d * 0.5 - 0.025,
                // 既定は1F編集を全階へ連動。旧JSONのsyncFirstは互換用に残す。
                syncFirst: true,
                individualEdit: false,
                activeFloor: 0,
                floors,
            };
        }
        if (kind === "rect" || kind === "circle")
            return {
                ...base,
                type: kind === "circle" ? "circ" : "rect",
                asset: kind,
                ra: info.w / 2,
                rb: info.d / 2,
                h: 0,
                extrude: false,
            };
        if (kind === "box")
            return {
                ...base,
                type: "asset",
                asset: kind,
                assetId: "box",
                assetName: info.label,
                ra: info.w / 2,
                rb: info.d / 2,
                h: height,
                extrude: true,
            };
        if (kind === "beveledBox")
            return {
                ...base,
                type: "asset",
                asset: kind,
                assetId: "beveled-box",
                assetName: info.label,
                ra: info.w / 2,
                rb: info.d / 2,
                h: 0,
                extrude: false,
                bevelOffset: info.bevelOffset,
                bevelSegments: info.bevelSegments,
            };
        return {
            ...base,
            type: "asset",
            asset: kind,
            ra: info.w / 2,
            rb: info.d / 2,
            h: height,
            pose: kind === "person" ? "stand" : undefined,
            bodyScale: kind === "person" ? 1 : undefined,
            shoulderScale: kind === "person" ? 1 : undefined,
            headScale: kind === "person" ? 1 : undefined,
            legSpread: kind === "person" ? 1 : undefined,
            faceW: kind === "sign" ? info.w * 0.7 : undefined,
            faceH: kind === "sign" ? info.h * 0.34 : undefined,
            openingW: kind === "building" ? info.w * 0.56 : undefined,
            openingH: kind === "building" ? info.h * 0.66 : undefined,
            awningEdgeZ: kind === "awning" ? height : undefined,
            awningEdgeY: kind === "awning" ? -info.d / 2 : undefined,
            awningThickness: kind === "awning" ? Math.max(0.05, height * 0.14) : undefined,
            awningFrontBottom: kind === "awning" ? 0 : undefined,
            awningBackBottom: kind === "awning" ? 0 : undefined,
            awningEdgeEdited: kind === "awning" ? false : undefined,
            balconyFloorThickness: kind === "balcony" ? 0.16 : undefined,
            balconyRailHeight: kind === "balcony" ? Math.max(0.12, height - 0.16) : undefined,
            balconyRailThickness: kind === "balcony" ? 0.12 : undefined,
            balconyFrontRail: kind === "balcony" ? true : undefined,
            balconySideRail: kind === "balcony" ? true : undefined,
            balconyRailHeightEdited: kind === "balcony" ? false : undefined,
            path: kind === "pathPipe" ? pathPipeDefaultPoints() : undefined,
            pipeRadius: kind === "pathPipe" ? 0.18 : undefined,
            cornerRadius: kind === "pathPipe" ? 0.55 : undefined,
            cornerSteps: kind === "pathPipe" ? 6 : undefined,
            pipeSides: kind === "pathPipe" ? 10 : undefined,
            steps: kind === "stairs" ? Math.round(Number(el("stairsSteps")?.value) || 6) : undefined,
            handrail: kind === "stairs" ? !!el("stairsRail")?.checked : undefined,
            stripes: kind === "crosswalk" ? 7 : undefined,
        };
    }
    // 建物とテント／看板を親子として作る。
    // child.attachment が親の開口側へ追従するため、親の移動・回転・寸法変更に対応できる。
    function placeLinkedAsset(kind, p) {
        const childKind = kind === "buildingAwning" ? "awning" : "rect",
            q = p ? groundAt(p) : assetGroundPoint(ASSETS.building),
            parent = newAsset("building", null, q),
            child = newAsset(childKind, null, q),
            groupId = "linked-" + uid();
        // テント／看板付き建物は、親建物を必ずY面（地面に立つ向き）で作る。
        // assetAxisがX/Zでも親まで壁面向きにすると、parent.rbが高さ扱いになり、
        // 子テントの接着計算が建物の中央へ入り込むため、ここで座標系を固定する。
        if (kind === "buildingAwning" || kind === "buildingSign") {
            parent.k = 1;
            parent.d = -1;
            parent.ca = Number(q[0]) || 0;
            parent.cb = Number(q[2]) || 0;
            parent.lift = 0;
            parent.off = [0, 0, 0];
        }
        if (kind === "buildingAwning") {
            parent.ra = ASSETS.building.w / 2;
            parent.rb = ASSETS.building.d / 2;
            parent.h = ASSETS.building.h;
            parent.extrude = true;
            parent.openingEnabled = false;
            parent.accent = "#d98b68";
        } else {
            // 看板付き建物は従来どおり開口ありを初期状態にする。
            parent.openingEnabled = true;
        }
        parent.groupId = child.groupId = groupId;
        parent.linkedAsset = child.linkedAsset = kind;
        parent.linkedRole = "parent";
        child.linkedRole = "child";
        // 開口側（建物のローカルYマイナス面）へ接着する。
        // 反対側へ回り込まないよう、親の回転に追従するローカル面として保持する。
        child.attachment = {
            parentId: parent.id,
            side: -1,
            x: 0,
            baseZ: kind === "buildingAwning" ? parent.h * 0.52 : parent.h * 0.56,
            offsetZ: 0,
            rotOffset: 0,
            verticalOnly: true,
        };
        if (kind === "buildingSign") {
            child.ra = parent.ra * 0.72;
            child.rb = Math.max(0.12, parent.rb * 0.16);
            child.h = Math.max(0.35, parent.h * 0.23);
            child.extrude = true;
            child.accent = "#66e3c8";
        } else {
            child.ra = parent.ra * 0.46;
            child.rb = Math.max(0.18, parent.rb * 0.3);
            child.h = Math.max(0.28, parent.h * 0.2);
            child.awningEdgeZ = child.h;
            child.awningEdgeY = -child.rb;
            child.awningThickness = Math.max(0.04, child.h * 0.14);
            child.awningFrontBottom = 0;
            child.awningBackBottom = 0;
            child.awningEdgeEdited = false;
        }
        const attached = syncAttachedPart(child, parent);
        return { parent, child: attached };
    }
    function placeLinkedAssetInstance(kind, p) {
        sanitizeScene();
        const before = S.slice(),
            wasFloor = !!window.cityFloorPlanActive;
        try {
            const bundle = placeLinkedAsset(kind, p),
                lines = [...genShape(bundle.parent), ...genShape(bundle.child)];
            if (!lines.length || lines.some((s) => !validStroke(s)))
                throw new Error("linked asset geometry is empty or malformed");
            HU.push(S);
            RD = [];
            S = [...S, ...lines];
            // 接続アセットは、配置直後から看板／テントの編集ハンドルを表示する。
            setSelection(bundle.child.id, false);
            tool = "edit";
            setMode("draw");
            if (wasFloor) {
                fitFloorPlan();
                setMode("draw");
            } else if (kind === "buildingSign") setStudioWorkspace("perspective");
            syncSel();
            render();
        } catch (err) {
            S = before;
            prev = null;
            clearSelection();
            console.error("City Grid linked asset error", err);
            try {
                render();
            } catch (e) {}
            alert("接続アセットを配置できませんでした。もう一度クリックしてください。");
        }
    }
    function selectedBalconyParent() {
        const parent = sel ? obOf(sel) : null;
        // 建物アセットを選択しているときは、その正面（ローカルYマイナス面）へ自動接着する。
        // 既存の建物接着と同じ親子同期経路を使うため、親の移動・寸法変更にも追従する。
        return parent &&
            parent.type === "asset" &&
            ["building", "stackedBuilding", "beveledStackedBuilding"].includes(parent.asset) &&
            parent.k === 1
            ? parent
            : null;
    }
    function newAttachedBalcony(parent) {
        const isStacked = isStackedBuildingAsset(parent),
            floors = Array.isArray(parent.floors) ? parent.floors : [],
            floorIndex = isStacked
                ? clamp(Math.round(Number(parent.activeFloor) || 1), 0, Math.max(0, floors.length - 1))
                : 0,
            floor = isStacked ? floors[floorIndex] : null,
            wallPoint = isStacked
                ? customPt(
                      parent,
                      Number(floor?.x) || 0,
                      (Number(floor?.y) || 0) - Math.abs(Number(floor?.d) || 3) * 0.5,
                      Number(floor?.z) || 0,
                  )
                : L2W(parent, 0, -Math.abs(Number(parent.rb) || 0.5), 0),
            child = newAsset("balcony", null, wallPoint);
        child.k = 1;
        child.d = -1;
        child.ca = 0;
        child.cb = 0;
        child.off = [0, 0, 0];
        child.lift = 0;
        child.rot = Number(parent.rot) || 0;
        child.attachment = {
            parentId: parent.id,
            side: -1,
            x: 0,
            ...(isStacked
                ? { stackedFloor: true, floorIndex, baseZ: Number(floor?.z) || 0 }
                : { baseRatio: 0.58, baseZ: Math.max(0.1, (Number(parent.h) || 3) * 0.58) }),
            offsetZ: 0,
            rotOffset: 0,
            verticalOnly: true,
        };
        return syncAttachedPart(child, parent);
    }
    function placeBalcony(p) {
        sanitizeScene();
        const before = S.slice(),
            wasFloor = !!window.cityFloorPlanActive;
        try {
            const parent = selectedBalconyParent(),
                o = parent ? newAttachedBalcony(parent) : newAsset("balcony", p),
                lines = genShape(o);
            if (!lines.length || lines.some((s) => !validStroke(s)))
                throw new Error("balcony geometry is empty or malformed");
            HU.push(S);
            RD = [];
            S = [...S, ...lines];
            setSelection(o.id, false);
            tool = "edit";
            setMode("draw");
            if (wasFloor) {
                fitFloorPlan();
                setMode("draw");
            }
            syncSel();
            render();
        } catch (err) {
            S = before;
            prev = null;
            clearSelection();
            console.error("City Grid balcony asset error", err);
            try {
                render();
            } catch (e) {}
            alert("ベランダを配置できませんでした。建物を選択してからもう一度クリックしてください。");
        }
    }
    // 通常アセット、ベランダ、接続アセットを入口で振り分ける配置関数。
    function placeAsset(kind, p) {
        if (kind === "buildingAwning" || kind === "buildingSign") return placeLinkedAssetInstance(kind, p);
        if (kind === "balcony") return placeBalcony(p);
        sanitizeScene();
        const before = S.slice(),
            wasFloor = !!window.cityFloorPlanActive;
        try {
            const o = newAsset(kind, p),
                lines = genShape(o);
            if (!lines.length || lines.some((s) => !validStroke(s)))
                throw new Error("asset geometry is empty or malformed");
            HU.push(S);
            RD = [];
            S = [...S, ...lines];
            setSelection(o.id, false);
            tool = "edit";
            setMode("draw");
            // 間取りから追加したアセットは、そのまま間取りに留めて選択状態を保つ。
            if (wasFloor) {
                fitFloorPlan();
                setMode("draw");
            } else if (kind === "person") setStudioWorkspace("character");
            syncSel();
            render();
        } catch (err) {
            S = before;
            prev = null;
            clearSelection();
            console.error("City Grid asset error", err);
            try {
                render();
            } catch (e) {}
            alert("アセットを配置できませんでした。壊れた線は取り除きました。もう一度クリックしてください。");
        }
    }

    // オブジェクト用クリップボード。線画のクリップボードとは分けて、選択中の
    // 図形／アセット定義だけをコピーし、貼り付け時に新しいIDで再生成する。
    let objectClipboard = [];
    // 線画ではなく、選択中オブジェクトの定義をJSONとしてクリップボードへ保持する。
    function copySelectedObjects() {
        const objects = selectedObjects();
        if (!objects.length) return false;
        objectClipboard = objects.map((o) => JSON.parse(JSON.stringify(o)));
        return true;
    }
    // コピーした定義へ新しいID・グループIDを付け、少しずらして再生成する。
    function pasteObjectClipboard() {
        if (!objectClipboard.length) return false;
        sanitizeScene();
        const before = S.slice(),
            added = [];
        try {
            const lines = [],
                groupMap = new Map(),
                idMap = new Map(objectClipboard.map((source) => [source.id, uid()]));
            objectClipboard.forEach((source, i) => {
                const n = JSON.parse(JSON.stringify(source));
                n.id = idMap.get(source.id);
                n.off = [...(n.off || [0, 0, 0])];
                if (source.attachment?.parentId && idMap.has(source.attachment.parentId))
                    n.attachment = { ...source.attachment, parentId: idMap.get(source.attachment.parentId) };
                if (source.groupId) {
                    if (!groupMap.has(source.groupId)) groupMap.set(source.groupId, "group-" + uid());
                    n.groupId = groupMap.get(source.groupId);
                }
                // 元の場所を保ちつつ、貼り付け先が見つけやすいようにca方向へ少しずらす。
                const shift = Math.max(0.35, Math.abs(Number(n.ra) || 0.25) * 2.4) + i * 0.18;
                if (n.type === "compound") Object.assign(n, moveBy(n, [shift, 0, 0]));
                else if (!n.attachment?.parentId) {
                    n.ca = Number(n.ca) || 0;
                    n.ca += shift;
                }
                const made = genShape(n);
                if (!made.length || made.some((s) => !validStroke(s)))
                    throw new Error("pasted object geometry is empty or malformed");
                lines.push(...made);
                added.push(n.id);
            });
            HU.push(S);
            RD = [];
            S = [...S, ...lines];
            regenObjects();
            setSelection(added[0], false);
            added.slice(1).forEach((id) => setSelection(id, true));
            tool = "edit";
            setMode("draw");
            if (window.cityFloorPlanActive) {
                fitFloorPlan();
                setMode("draw");
            }
            render();
            return true;
        } catch (err) {
            S = before;
            console.error("City Grid object paste error", err);
            render();
            return false;
        }
    }

    function linkedDefsFromImportedCompound(source) {
        if (source?.type !== "compound" || !Array.isArray(source.parts)) return null;
        const shift = [Number(source.tx) || 0, Number(source.ty) || 0, Number(source.tz) || 0],
            parts = source.parts.map((part) => translateDefinition(fixOb(part), shift));
        const awning = parts.find((part) => part.asset === "awning"),
            building = parts.find((part) => part.asset === "building"),
            rects = parts.filter((part) => part.type === "rect" && part.asset === "rect");
        const child = awning || (building && rects.length ? rects[0] : null),
            parent = awning
                ? parts.find((part) => part !== awning && (part.type === "rect" || part.asset === "building")) ||
                  parts[0]
                : building;
        if (!parent || !child) return null;
        const kind = awning ? "buildingAwning" : "buildingSign",
            groupId = "linked-" + uid(),
            p = { ...parent, id: uid(), groupId, linkedAsset: kind, linkedRole: "parent" },
            q = { ...child, id: uid(), groupId, linkedAsset: kind, linkedRole: "child" };
        // 旧テント付きcompoundの親はrectで保存されているため、現在の建物アセットへ移行する。
        // これで新しい開口チェックボックスと、開口建物の線画・面表示を共通利用できる。
        if (kind === "buildingAwning") {
            p.type = "asset";
            p.asset = "building";
            p.assetId = "building-awning";
            p.assetName = ASSETS.buildingAwning.label;
            p.openingEnabled = false;
            p.openingW = Number(p.openingW) || Math.abs(Number(p.ra) || 2) * 2 * 0.56;
            p.openingH = Number(p.openingH) || Math.max(0.1, Number(p.h) || 3.6) * 0.66;
        } else {
            p.openingEnabled = p.openingEnabled !== false;
        }
        // 旧compound JSONにX/Z面の親が残っていても、接続建物は地面に立つY面へ戻す。
        // これにより、読み込み後のテント／看板も親の高さ・奥行き基準で接着できる。
        if (p.k !== 1) {
            const center = L2W(p, 0, 0, 0);
            p.k = 1;
            p.d = -1;
            p.ca = Number(center[0]) || 0;
            p.cb = Number(center[2]) || 0;
            p.lift = 0;
            p.off = [0, 0, 0];
        }
        const pb = L2W(p, 0, 0, 0),
            cb = L2W(q, 0, 0, 0),
            dx = cb[0] - pb[0],
            dz = cb[2] - pb[2],
            r = Number(p.rot || 0) * DG;
        // 添付データの現在位置ではなく、開口側のローカルYマイナス面へ補正する。
        q.attachment = {
            parentId: p.id,
            side: -1,
            x: dx * Math.cos(r) + dz * Math.sin(r),
            baseZ: cb[1] - pb[1],
            offsetZ: 0,
            rotOffset: 0,
            verticalOnly: true,
        };
        return [p, syncAttachedPart(q, p)];
    }
    // オブジェクトJSONを検証・正規化して、現在のシーンへ追加する。
    function importObjectPayload(data) {
        const sources = Array.isArray(data?.objects) ? data.objects : data?.type === "compound" ? [data] : [];
        if (!sources.length) throw new Error("objects are missing");
        const defs = [];
        sources.forEach((source) => {
            const linked = linkedDefsFromImportedCompound(source);
            if (linked) defs.push(...linked);
            else if (source.type === "compound")
                defs.push({
                    ...source,
                    id: uid(),
                    parts: (source.parts || []).map((part) => ({ ...fixOb(part), id: uid() })),
                });
            else defs.push({ ...fixOb(source), id: uid() });
        });
        sanitizeScene();
        const lines = defs.flatMap((def) => genShape(def));
        if (!lines.length || lines.some((s) => !validStroke(s)))
            throw new Error("imported geometry is empty or malformed");
        HU.push(S);
        RD = [];
        S = [...S, ...lines];
        clearSelection();
        defs.forEach((def) => selIds.add(def.id));
        sel = (defs.find((def) => def.linkedRole === "child") || defs[0])?.id || null;
        normalizeSelection();
        tool = "edit";
        setMode("draw");
        if (window.cityFloorPlanActive) fitFloorPlan();
        syncSel();
        render();
    }

    // 既存建物の左右の横壁へ、小型看板を任意で接着する。
    // 建物本体の種類を変えず、attachmentで親の移動・回転・寸法変更へ追従させる。
    function wallSideSignChildren(parentId) {
        return sceneObjects()
            .filter((o) => o?.attachment?.parentId === parentId && o.attachment.wallSideSign)
            .sort((a, b) => (Number(a.attachment.floorIndex) || 0) - (Number(b.attachment.floorIndex) || 0));
    }
    function wallSideSignParent(id) {
        const o = obOf(id),
            parent = o?.attachment?.parentId ? obOf(o.attachment.parentId) : o;
        return parent && parent.type === "asset" && (parent.asset === "building" || isStackedBuildingAsset(parent))
            ? parent
            : null;
    }
    function wallSideSignScopeOf(parent, children = wallSideSignChildren(parent?.id)) {
        if (!isStackedBuildingAsset(parent)) return "first";
        if (["first", "all", "individual"].includes(parent?.wallSideSignScope)) return parent.wallSideSignScope;
        if (children.length > 1 && children.length >= (parent.floors?.length || 0)) return "all";
        if (children.some((child) => Number(child.attachment?.floorIndex) > 0)) return "individual";
        return "first";
    }
    function wallSideSignFloorIndices(parent, scope, flags, children = wallSideSignChildren(parent?.id)) {
        if (!isStackedBuildingAsset(parent)) return [0];
        const count = Math.max(1, Array.isArray(parent.floors) ? parent.floors.length : 1),
            normalized = ["first", "all", "individual"].includes(scope) ? scope : wallSideSignScopeOf(parent, children);
        if (normalized === "all") return Array.from({ length: count }, (_, i) => i);
        if (normalized === "individual") {
            const source = Array.isArray(flags)
                    ? flags
                    : Array.isArray(parent.wallSideSignFloors)
                      ? parent.wallSideSignFloors
                      : null,
                selected = source
                    ? source.map((value, index) => (value ? index : -1)).filter((index) => index >= 0 && index < count)
                    : children
                          .map((child) => Number(child.attachment?.floorIndex) || 0)
                          .filter((index, i, all) => index >= 0 && index < count && all.indexOf(index) === i);
            return selected.length ? selected : [0];
        }
        return [0];
    }
    function newWallSideSign(parent, side = 1, floorIndexOverride = null, template = null) {
        const stacked = isStackedBuildingAsset(parent),
            floors = stacked && Array.isArray(parent.floors) ? parent.floors : [],
            floorIndex = stacked
                ? clamp(
                      Math.round(Number(floorIndexOverride ?? parent.activeFloor) || 0),
                      0,
                      Math.max(0, floors.length - 1),
                  )
                : 0,
            floor = stacked ? floors[floorIndex] || floors[0] : null,
            parentW = stacked ? Math.abs(Number(floor?.w) || 4) : Math.abs(Number(parent.ra) || 2) * 2,
            parentD = stacked ? Math.abs(Number(floor?.d) || 3) : Math.abs(Number(parent.rb) || 1.5) * 2,
            parentH = stacked ? Math.abs(Number(floor?.h) || 2.2) : Math.abs(Number(parent.h) || 3),
            width = template
                ? Math.max(0.05, Math.abs(Number(template.rb) || 0.75) * 2)
                : clamp(parentD * 0.3, 0.55, 1.5),
            height = template
                ? Math.max(0.05, Math.abs(Number(template.ra) || 0.9) * 2)
                : clamp(parentH * 0.28, 0.45, 1.25),
            thickness = template
                ? Math.max(0.02, Math.abs(Number(template.h) || 0.12))
                : clamp(Math.min(parentD, parentW) * 0.035, 0.08, 0.18),
            bracketCount = clamp(
                Math.round(Number(parent.wallSideSignBracketCount ?? template?.wallSideSignBracketCount ?? 3)),
                0,
                3,
            ),
            bracketLength = clamp(
                Math.abs(Number(parent.wallSideSignBracketLength ?? template?.wallSideSignBracketLength) || 0.36),
                0.05,
                5,
            ),
            shape =
                parent.wallSideSignShape === "beveled"
                    ? "beveled"
                    : template?.wallSideSignShape === "beveled"
                      ? "beveled"
                      : "box",
            bevelOffset = clamp(
                Number(parent.wallSideSignBevelOffset ?? template?.wallSideSignBevelOffset) || 0.06,
                0.01,
                1,
            ),
            sideValue = side < 0 ? -1 : 1,
            templateAttachment = template?.attachment,
            centerRatio = Number.isFinite(Number(templateAttachment?.centerRatio))
                ? Number(templateAttachment.centerRatio)
                : stacked
                  ? 0.58
                  : 0.68,
            depthOffset = Number.isFinite(Number(templateAttachment?.depthOffset))
                ? Number(templateAttachment.depthOffset)
                : 0,
            sign = {
                id: uid(),
                type: "asset",
                asset: "wallSideSign",
                assetId: "wall-side-sign",
                assetName: "横壁看板",
                k: 1,
                d: -1,
                off: [0, 0, 0],
                ca: 0,
                cb: 0,
                rot: Number(parent.rot) || 0,
                lift: 0,
                wf: true,
                c: template?.c || parent.c || "#222222",
                w: Math.max(1, Number(parent.w) || MASTER_W),
                // 横壁ではraを縦方向、rbを壁に沿う奥行方向、hを壁からの厚みに使う。
                ra: height / 2,
                rb: width / 2,
                h: thickness,
                extrude: true,
                wallSideSign: true,
                wallSideSignBracketCount: bracketCount,
                wallSideSignBracketLength: bracketLength,
                wallSideSignShape: shape,
                wallSideSignBevelOffset: bevelOffset,
                wallSideSignBevelSegments: 4,
                wallSideSignSide: sideValue,
            };
        sign.attachment = {
            parentId: parent.id,
            wallSideSign: true,
            wallSideSignSide: sideValue,
            ...(stacked ? { stackedFloor: true, floorIndex } : {}),
            side: sideValue,
            depthOffset,
            centerRatio,
            offsetZ: 0,
            rotOffset: 0,
            verticalOnly: true,
        };
        return syncAttachedPart(sign, parent);
    }
    function toggleWallSideSign(
        parentId,
        enabled,
        side = 1,
        bracketCount = 3,
        bracketLength = 0.36,
        shape = "box",
        bevelOffset = 0.06,
        scope = null,
        floorFlags = null,
    ) {
        const parent = wallSideSignParent(parentId);
        if (!parent) return false;
        const before = S.slice(),
            oldChildren = wallSideSignChildren(parent.id),
            oldIds = new Set(oldChildren.map((child) => child.id)),
            count = clamp(Math.round(Number(bracketCount) || 0), 0, 3),
            length = clamp(Math.abs(Number(bracketLength) || 0.36), 0.05, 5),
            form = shape === "beveled" ? "beveled" : "box",
            bevel = clamp(Number(bevelOffset) || 0.06, 0.01, 1),
            stacked = isStackedBuildingAsset(parent),
            scopeValue = stacked
                ? ["first", "all", "individual"].includes(scope)
                    ? scope
                    : wallSideSignScopeOf(parent, oldChildren)
                : "first",
            indices = wallSideSignFloorIndices(parent, scopeValue, floorFlags, oldChildren),
            floorCount = stacked ? Math.max(1, parent.floors?.length || 1) : 1,
            signFloors = Array.from({ length: floorCount }, (_, index) => indices.includes(index)),
            oldByFloor = new Map(oldChildren.map((child) => [Number(child.attachment?.floorIndex) || 0, child]));
        try {
            HU.push(S);
            RD = [];
            S = S.filter((s) => s?.ob?.id !== parent.id && !oldIds.has(s?.ob?.id));
            const nextParent = {
                ...parent,
                wallSideSignEnabled: !!enabled,
                wallSideSignSide: side < 0 ? -1 : 1,
                wallSideSignBracketCount: count,
                wallSideSignBracketLength: length,
                wallSideSignShape: form,
                wallSideSignBevelOffset: bevel,
                wallSideSignBevelSegments: 4,
                wallSideSignScope: scopeValue,
                wallSideSignFloors: signFloors,
            };
            S = [...S, ...genShape(nextParent)];
            if (enabled) {
                const fallbackTemplate = oldByFloor.get(0) || oldChildren[0] || null;
                indices.forEach((floorIndex) => {
                    const template = oldByFloor.get(floorIndex) || fallbackTemplate,
                        sign = newWallSideSign(nextParent, side, floorIndex, template);
                    S = [...S, ...genShape(sign)];
                });
            }
            regenObjects();
            setSelection(parent.id, false);
            tool = "edit";
            setMode("draw");
            render();
            return true;
        } catch (err) {
            S = before;
            console.error("City Grid wall-side sign error", err);
            render();
            return false;
        }
    }
    window.cityGridWallSideSignToggle = toggleWallSideSign;

    // ===== アセット棚と配置ボタン =====
    // 棚のボタンはplaceAsset()へ集約し、UIイベント内に形状生成ロジックを重複させない。
    const tray = document.createElement("div");
    tray.id = "assetTray";
    tray.innerHTML =
        '<div class="assetTrayInner"><div class="assetTrayTitle">シーンに追加</div><div class="assetTrayTools"><label>生成面<select id="assetAxisTray"><option value="1">Y：地面／上下</option><option value="0">X：左右の面</option><option value="2">Z：正面／背面</option></select></label></div><div class="assetClipboardTools"><button type="button" id="objectCopy">コピー</button><button type="button" id="objectPaste" disabled>貼り付け</button><button type="button" id="objectImportButton">JSON読込</button><input id="objectImportFile" type="file" accept="application/json,.json" hidden></div>' +
        // 通常の「看板」アセットは、建物へ接着する横壁看板へ統合したため棚から外す。
        // 既存JSONのasset=signはASSETS定義を残して読み込み・表示できるようにする。
        Object.entries(ASSETS)
            .filter(([k]) => k !== "sign")
            .map(
                ([k, v]) =>
                    `<button class="assetCard" data-asset="${k}" title="${v.label}を追加${k === "balcony" ? "（建物選択中は壁へ接着）" : ""}"><span class="assetGlyph">${v.glyph}</span><span>${v.label}</span></button>`,
            )
            .join("") +
        '</div><div class="assetTrayNote">建物を選択して「壁付けベランダ」を押すと、正面壁の2階相当へ自動接着。未選択なら地面へ配置。パスパイプは選択後に画面上の制御点と半径ハンドルを編集できます。</div>';
    stage.appendChild(tray);
    const assetAxisTrayInput = el("assetAxisTray");
    window.cityGridAssetAxisTray = assetAxisTrayInput;
    const setAssetAxis = (value) => {
        P.assetAxis = clamp(Math.round(Number(value)), 0, 2);
        if (bridge.syncAssetAxis) bridge.syncAssetAxis();
        render();
    };
    assetAxisTrayInput.onchange = () => setAssetAxis(assetAxisTrayInput.value);
    if (bridge.syncAssetAxis) bridge.syncAssetAxis();
    tray.addEventListener("click", (e) => {
        const b = e.target.closest("[data-asset]");
        if (b) placeAsset(b.dataset.asset);
    });
    const objectCopyButton = el("objectCopy"),
        objectPasteButton = el("objectPaste"),
        objectImportButton = el("objectImportButton"),
        objectImportFile = el("objectImportFile");
    objectCopyButton.onclick = () => {
        if (!copySelectedObjects()) return;
        objectPasteButton.disabled = false;
        const label = objectCopyButton.textContent;
        objectCopyButton.textContent = "コピー済み";
        setTimeout(() => (objectCopyButton.textContent = label), 900);
    };
    objectPasteButton.onclick = () => {
        if (pasteObjectClipboard()) {
            objectPasteButton.disabled = false;
            const label = objectPasteButton.textContent;
            objectPasteButton.textContent = "貼り付け済み";
            setTimeout(() => (objectPasteButton.textContent = label), 900);
        }
    };
    objectImportButton.onclick = () => objectImportFile?.click();
    objectImportFile.onchange = (e) => {
        const f = e.target.files[0];
        if (!f) return;
        f.text()
            .then((text) => {
                const data = JSON.parse(text);
                if (data.app === "perspective-ruler-grid") unpack(data);
                else importObjectPayload(data);
            })
            .catch((err) => {
                console.error("City Grid object import error", err);
                alert("オブジェクトJSONを読み込めませんでした");
            });
        e.target.value = "";
    };
    // 選択中オブジェクトを、後から線画化できるテキストJSONとして取り出す。
    // 線そのものではなく定義を保存するので、寸法・向き・ポーズ・アセット固有値を保てる。
    const objectInfoCopyButton = el("objectInfoCopy"),
        objectInfoSaveButton = el("objectInfoSave");
    function objectInfoPayload() {
        const objects = selectedObjects().map((o) => {
            const q = JSON.parse(JSON.stringify(o));
            delete q.surface;
            delete q.surfaceColor;
            delete q.surfaceAlpha;
            if (q.asset === "sign") delete q.bevel;
            return q;
        });
        return {
            format: "city-grid-studio-object-v1",
            coordinateSystem: {
                local: "x=幅／左右, y=奥行／前後, z=高さ／上",
                planeAxis: "k=0:X面, k=1:Y面(地面), k=2:Z面",
                rotation: "rotは度",
                halfSize: "ra/rbは幅・奥行の半分",
            },
            renderMode: { surface: !!P.surfaceMode, backfaceRemoval: !!P.surfaceMode },
            objects,
        };
    }
    function objectInfoText() {
        return JSON.stringify(objectInfoPayload(), null, 2);
    }
    function writeTextToClipboard(text) {
        if (navigator.clipboard?.writeText) return navigator.clipboard.writeText(text);
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        try {
            document.execCommand("copy");
        } finally {
            ta.remove();
        }
        return Promise.resolve();
    }
    function flashObjectInfoButton(button, label) {
        if (!button) return;
        const before = button.textContent;
        button.textContent = label;
        setTimeout(() => (button.textContent = before), 900);
    }
    function syncObjectInfoActions() {
        const disabled = !selectedObjects().length;
        if (objectInfoCopyButton) objectInfoCopyButton.disabled = disabled;
        if (objectInfoSaveButton) objectInfoSaveButton.disabled = disabled;
        const sceneDeleteButton = el("sceneDeleteButton");
        if (sceneDeleteButton) sceneDeleteButton.disabled = disabled;
    }
    window.cityGridSyncObjectInfoActions = syncObjectInfoActions;
    if (objectInfoCopyButton)
        objectInfoCopyButton.onclick = () => {
            if (!selectedObjects().length) return;
            writeTextToClipboard(objectInfoText())
                .then(() => flashObjectInfoButton(objectInfoCopyButton, "コピー済み"))
                .catch(() => alert("オブジェクト情報をコピーできませんでした"));
        };
    if (objectInfoSaveButton)
        objectInfoSaveButton.onclick = () => {
            if (!selectedObjects().length) return;
            const a = document.createElement("a"),
                url = URL.createObjectURL(new Blob([objectInfoText()], { type: "application/json" }));
            a.href = url;
            a.download = "city-grid-object.json";
            a.click();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
            flashObjectInfoButton(objectInfoSaveButton, "保存済み");
        };
    addEventListener("keydown", (e) => {
        if (!(e.ctrlKey || e.metaKey) || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
        if (e.key.toLowerCase() === "c" && selectedObjects().length) {
            e.preventDefault();
            objectCopyButton.click();
        } else if (e.key.toLowerCase() === "v" && objectClipboard.length) {
            e.preventDefault();
            objectPasteButton.click();
        }
    });
    el("assetToggle").onclick = () => {
        tray.style.display = tray.style.display === "block" ? "none" : "block";
        el("assetToggle").classList.toggle("on", tray.style.display === "block");
        tray.classList.toggle("floorAssetTray", !!window.cityFloorPlanActive && tray.style.display === "block");
        requestAnimationFrame(syncFloorPlanDockLayout);
    };

    // ===== 4本指プリミティブクイックメニュー =====
    // 基本6種だけを小さなメニューから追加できる。実体の生成は通常のplaceAsset()へ委譲する。
    // 4本指タップで開く、長方形・円・円錐・球体・三角柱・三角錐専用の小型メニュー。
    const primitiveKinds = ["rect", "circle", "cone", "sphere", "triPrism", "triPyramid"];
    const primitiveMenu = document.createElement("div");
    primitiveMenu.id = "primitiveQuickMenu";
    primitiveMenu.innerHTML =
        '<div class="primitiveMenuTitle">プリミティブを追加</div><div class="primitiveMenuGrid">' +
        primitiveKinds
            .map((k) => {
                const v = ASSETS[k];
                return `<button class="primitiveCard" data-primitive="${k}"><b>${v.glyph}</b><small>${v.label}</small></button>`;
            })
            .join("") +
        '</div><div class="primitiveMenuSub">4本指タップで開閉　・　選ぶと現在の生成方向へ配置</div>';
    stage.appendChild(primitiveMenu);
    function togglePrimitiveMenu() {
        primitiveMenu.classList.toggle("open");
    }
    function closePrimitiveMenu() {
        primitiveMenu.classList.remove("open");
    }
    window.cityPrimitiveMenuToggle = togglePrimitiveMenu;
    primitiveMenu.addEventListener("click", (e) => {
        const b = e.target.closest("[data-primitive]");
        if (!b) return;
        placeAsset(b.dataset.primitive);
        closePrimitiveMenu();
    });
    document.addEventListener("pointerdown", (e) => {
        if (!e.target.closest("#primitiveQuickMenu") && !e.target.closest("#cv")) closePrimitiveMenu();
    });
};

        const step = e.shiftKey ? 0.5 : 0.1;
        if (e.key === "ArrowLeft") {
            e.preventDefault();
            moveFloorSelected(-step, 0);
        } else if (e.key === "ArrowRight") {
            e.preventDefault();
            moveFloorSelected(step, 0);
        } else if (e.key === "ArrowUp") {
            e.preventDefault();
            moveFloorSelected(0, -step);
        } else if (e.key === "ArrowDown") {
            e.preventDefault();
            moveFloorSelected(0, step);
        } else if (e.key === "q" || e.key === "Q") {
            e.preventDefault();
            rotateFloorSelected(15);
        } else if (e.key === "e" || e.key === "E") {
            e.preventDefault();
            rotateFloorSelected(-15);
        } else if (e.key === "Delete" || e.key === "Backspace") {
            e.preventDefault();
            if (floorPlanObject()) el("obDel").click();
        }
    });
    addEventListener("keyup", (e) => {
        if (e.code === "Space") floorPlanPanMode = false;
    });
    addEventListener("blur", () => (floorPlanPanMode = false));

    // ===== Camera / scale presets =====
    function setValues(values) {
        Object.entries(values).forEach(([k, v]) => {
            if (k in P) setP(k, v);
        });
        sync();
        render();
    }
    function preset(name) {
        // カメラプリセットは視点だけを変更し、グリッド種類は現在の選択を保持する。
        if (name === "alley") {
            setValues({ lens: 38, yaw: 39.912, hz: 50, pitch: 0, ch: 1.62, cx: 0, cz: 0 });
            el("bgw").checked = true;
            el("pc").value = "#222222";
        } else if (name === "top") {
            // 添付された街並みのような、地面を広く見渡す見下ろし視点。
            setValues({ lens: 35, yaw: 39.912, hz: 52, pitch: -57, ch: 4.2, cx: 0, cz: 0 });
            el("bgw").checked = true;
            el("pc").value = "#222222";
        } else if (name === "three") {
            setValues({ lens: 42, yaw: 39.912, hz: 52, pitch: 27, ch: 2.3, cx: 0, cz: 0 });
            el("bgw").checked = true;
            el("pc").value = "#222222";
        } else {
            setValues({ lens: 45, yaw: 0, hz: 50, pitch: 0, ch: 1.6, cx: 0, cz: 0 });
            el("bgw").checked = true;
            el("pc").value = "#222222";
        }
        render();
    }

    // ===== User camera / settings presets =====
    const STUDIO_PRESET_KEY = "city-grid-studio-presets-v1";
    const studioPresetNameInput = el("studioPresetName"),
        studioPresetSelect = el("studioPresetSelect");
    // オブジェクトを除く、カメラ・グリッド・補助線・ペン・消しゴム・表示設定をまとめて保存する。
    const presetCheckIds = ["gon", "hzl", "bgw", "bin", "zf", "gg", "p3", "snp", "pn"];
    const presetSelectIds = ["snap", "em"];
    function readStudioPresets() {
        try {
            const a = JSON.parse(localStorage.getItem(STUDIO_PRESET_KEY) || "[]");
            return Array.isArray(a) ? a : [];
        } catch (e) {
            return [];
        }
    }
    function writeStudioPresets(a) {
        try {
            localStorage.setItem(STUDIO_PRESET_KEY, JSON.stringify(a));
            return true;
        } catch (e) {
            return false;
        }
    }
    function captureStudioPreset(name) {
        const checks = {},
            selects = {};
        presetCheckIds.forEach((id) => {
            const n = el(id);
            if (n) checks[id] = !!n.checked;
        });
        presetSelectIds.forEach((id) => {
            const n = el(id);
            if (n) selects[id] = n.value;
        });
        const ui = {
            sideHidden: el("side")?.classList.contains("hide") || false,
            details: [...document.querySelectorAll("#side details")].map((d) => !!d.open),
            trayOpen: el("assetTray")?.style.display === "block",
            workspace: quick?.querySelector("[data-workspace-tab].active")?.dataset.workspaceTab || "perspective",
        };
        return {
            name: name || "名称未設定",
            version: 4,
            // プリセットは設定だけを保存し、オブジェクトと描画線は保存しない。
            P: { ...P },
            gt: el("gt").value,
            orthView: orthView || null,
            mode,
            tool,
            ar: el("ar").value,
            show: [...show],
            checks,
            selects,
            snap: el("snap").value,
            pc: el("pc").value,
            cr: CR ? { ...CR } : null,
            zoom: { Z, ox, oy },
            photo: typeof IMGsrc === "string" && IMGsrc.startsWith("data:") ? IMGsrc : null,
            ui,
            floorActive: !!window.cityFloorPlanActive,
            floorCenter: Array.isArray(window.cityFloorPlanCenter) ? [...window.cityFloorPlanCenter] : null,
            floorScale: Number(window.cityFloorPlanScale) || null,
        };
    }
    function refreshStudioPresetList(selected = "") {
        if (!studioPresetSelect) return;
        const list = readStudioPresets();
        studioPresetSelect.textContent = "";
        if (!list.length) {
            const empty = document.createElement("option");
            empty.value = "";
            empty.textContent = "まだありません";
            studioPresetSelect.appendChild(empty);
        } else
            list.forEach((p) => {
                const option = document.createElement("option");
                option.value = String(p.name);
                option.textContent = String(p.name);
                studioPresetSelect.appendChild(option);
            });
        if (selected && list.some((p) => p.name === selected)) studioPresetSelect.value = selected;
    }
    function applyStudioPreset(d) {
        if (!d) return;
        if (window.cityFloorPlanActive) window.cityFloorPlanExit?.(true);
        if (d.ar != null) {
            el("ar").value = d.ar;
            el("ar").onchange();
        }
        if (d.gt != null) {
            el("gt").value = d.gt;
            applyType(d.gt);
        }
        if (d.P)
            Object.keys(d.P).forEach((k) => {
                if (k in P && d.P[k] != null) setP(k, d.P[k]);
            });
        // プリセット読込では、現在の3Dオブジェクトと描画線をそのまま維持する。
        if (Array.isArray(d.show))
            d.show.forEach((v, i) => {
                if (i < show.length) {
                    show[i] = !!v;
                    const n = document.querySelector('[data-i="' + i + '"]');
                    if (n) n.checked = !!v;
                }
            });
        if (d.checks)
            Object.entries(d.checks).forEach(([id, v]) => {
                const n = el(id);
                if (n) n.checked = !!v;
            });
        if (d.selects)
            Object.entries(d.selects).forEach(([id, v]) => {
                const n = el(id);
                if (n && v != null) n.value = v;
            });
        if (d.snap != null) el("snap").value = d.snap;
        if (d.pc != null) el("pc").value = d.pc;
        if (d.cr !== undefined) CR = d.cr ? { ...d.cr } : null;
        if (d.zoom && Number.isFinite(Number(d.zoom.Z))) {
            Z = clamp(Number(d.zoom.Z), 1, 10);
            ox = Number(d.zoom.ox) || 0;
            oy = Number(d.zoom.oy) || 0;
            updZ();
        }
        if ("photo" in d) {
            if (d.photo) {
                const im = new Image();
                im.onload = () => {
                    IMG = im;
                    IMGsrc = d.photo;
                    render();
                };
                im.src = d.photo;
            } else {
                IMG = null;
                IMGsrc = null;
            }
        }
        orthView = d.orthView || null;
        tool = d.tool === "shape" ? "edit" : d.tool || tool;
        if (d.ui) {
            if (Array.isArray(d.ui.details))
                document.querySelectorAll("#side details").forEach((section, i) => {
                    if (i < d.ui.details.length) section.open = !!d.ui.details[i];
                });
            if (typeof d.ui.sideHidden === "boolean") {
                setSide(d.ui.sideHidden);
                fit();
            }
            const tray = el("assetTray");
            if (tray && typeof d.ui.trayOpen === "boolean") {
                tray.style.display = d.ui.trayOpen ? "block" : "none";
                el("assetToggle")?.classList.toggle("on", d.ui.trayOpen);
                tray.classList.toggle("floorAssetTray", !!window.cityFloorPlanActive && d.ui.trayOpen);
            }
        }
        sync();
        if (d.floorActive) {
            window.cityFloorPlanEnter?.(orthView === "side" ? "side" : orthView === "front" ? "front" : "top");
            if (Array.isArray(d.floorCenter)) window.cityFloorPlanCenter = [...d.floorCenter];
            if (Number.isFinite(d.floorScale)) window.cityFloorPlanScale = d.floorScale;
            if (d.ui?.workspace === "floorplan") {
                quick
                    .querySelectorAll("[data-workspace-tab]")
                    .forEach((b) => b.classList.toggle("active", b.dataset.workspaceTab === "floorplan"));
                quick.querySelectorAll("[data-workspace-screen]").forEach((screen) => {
                    screen.hidden = screen.dataset.workspaceScreen !== "floorplan";
                });
            }
            setMode(d.mode === "view" ? "view" : "draw");
            render();
        } else {
            if (d.ui?.workspace && window.cityStudioWorkspace) window.cityStudioWorkspace(d.ui.workspace);
            setMode(d.mode === "draw" ? "draw" : "view");
            render();
        }
    }
    el("studioPresetSave").onclick = () => {
        const name = (studioPresetNameInput.value || "").trim() || `プリセット ${readStudioPresets().length + 1}`;
        const list = readStudioPresets().filter((p) => p.name !== name);
        list.push(captureStudioPreset(name));
        if (writeStudioPresets(list)) {
            studioPresetNameInput.value = name;
            refreshStudioPresetList(name);
        }
    };
    el("studioPresetLoad").onclick = () => {
        const name = studioPresetSelect.value,
            p = readStudioPresets().find((q) => q.name === name);
        if (p) applyStudioPreset(p);
    };
    el("studioPresetDelete").onclick = () => {
        const name = studioPresetSelect.value;
        if (!name) return;
        const list = readStudioPresets().filter((p) => p.name !== name);
        if (writeStudioPresets(list)) refreshStudioPresetList();
    };
    studioPresetSelect.onchange = () => {
        const p = readStudioPresets().find((q) => q.name === studioPresetSelect.value);
        if (p) studioPresetNameInput.value = p.name;
    };
    refreshStudioPresetList();

    // ===== Common lens buttons =====
    quick.querySelectorAll("[data-lens-preset]").forEach(
        (b) =>
            (b.onclick = () => {
                setP("lens", Number(b.dataset.lensPreset));
                sync();
                render();
            }),
    );
    quick.querySelectorAll("[data-preset]").forEach((b) => (b.onclick = () => preset(b.dataset.preset)));
    el("applyHuman").onclick = () => {
        const h = Math.max(0.5, Math.min(10, parseFloat(humanInput.value) || 1.7));
        P.hm = h;
        humanInput.value = h.toFixed(2);
        const people = sceneObjects().filter((o) => o.type === "asset" && o.asset === "person");
        if (people.length) {
            HU.push(S);
            RD = [];
            people.forEach((o) => {
                const body = Number(o.bodyScale) || 1,
                    shoulder = Number(o.shoulderScale) || 1;
                setOb(o.id, { h, ra: h * 0.135 * body * shoulder, rb: h * 0.088 * body });
            });
        }
        render();
    };
    humanInput.onchange = () => {
        P.hm = Math.max(0.5, Math.min(10, parseFloat(humanInput.value) || 1.7));
        humanInput.value = P.hm.toFixed(2);
    };
    el("eyeHeight").onclick = () => {
        P.ch = Math.max(0.3, P.hm * 0.93);
        sync();
        render();
    };
    el("applyStairs").onclick = () => {
        const o = sel && obOf(sel);
        if (!o || o.type !== "asset" || o.asset !== "stairs") {
            alert("先に編集モードで階段を選択してください");
            return;
        }
        const steps = Math.max(2, Math.min(24, Math.round(Number(el("stairsSteps").value) || 6))),
            handrail = !!el("stairsRail").checked;
        HU.push(S);
        RD = [];
        setOb(o.id, { steps, handrail });
        render();
    };

    // Reference image convenience. The supplied image is copied beside this HTML as reference-cyberpunk.jpg.
    el("sampleRef").onclick = () => {
        const im = new Image();
        im.onload = () => {
            IMG = im;
            IMGsrc = null;
            render();
        };
        im.onerror = () =>
            alert("reference-cyberpunk.jpg が見つかりません。左の「参考写真」から画像を選んでください。");
        im.src = "reference-cyberpunk.jpg";
    };
    el("clearRef").onclick = () => el("phx").click();

    // ===== Compact export / help UI =====
    el("exportToggle").onclick = (e) => {
        e.stopPropagation();
        setExportOpen(!el("exportMenu").classList.contains("open"));
        el("helpPanel")?.style.setProperty("display", "none");
    };
    document.addEventListener("pointerdown", (e) => {
        if (!e.target.closest("#exportMenu") && !e.target.closest("#exportToggle")) setExportOpen(false);
    });
    // ===== 6. ヘルプ・キーボード・初期表示 =====
    // 最後にヘルプ表示、初期設定、localStorage移行を登録してUIを完成させる。
    const help = document.createElement("div");
    help.id = "helpPanel";
    help.innerHTML =
        '<div class="helpTitle">操作のコツ</div><div><span class="helpKey">Pencil</span>線を引く　<span class="helpKey">指</span>視点・ピンチ</div><div><span class="helpKey">⌘ Z</span>元に戻す　<span class="helpKey">E</span>消しゴム</div><div><span class="helpKey">図形</span>ドラッグで床・壁に配置</div><div><span class="helpKey">編集</span>線を選択 → 矢印移動／白い四角で拡縮／輪で回転</div><div style="margin-top:7px;color:#7f999c">アセットを追加したあと、編集モードでBlender風ギズモを使えます。人物は基準身長から作られます。</div>';
    el("main").appendChild(help);
    el("helpToggle").onclick = () => {
        help.style.display = help.style.display === "block" ? "none" : "block";
        setExportOpen(false);
    };

    // A first-run cyberpunk treatment; the controls remain fully editable in the sidebar.
    let v2Seen = false,
        hasAuto = false,
        sidePref = "";
    try {
        v2Seen = !!localStorage.getItem("city-grid-v2-seen");
        hasAuto = !!localStorage.getItem("pgrid-autosave-v1");
        sidePref = localStorage.getItem("pgrid-side") || "";
    } catch (e) {}
    if (!v2Seen && !hasAuto) {
        el("bgw").checked = true;
        el("pc").value = "#222222";
        P.ch = 1.62;
        el("ch").value = P.ch;
        try {
            localStorage.setItem("city-grid-v2-seen", "1");
        } catch (e) {}
    }
    // Existing sessions may already have the dark first-run flag. Migrate once to the white drawing background.
    let whiteMigrated = false;
    try {
        whiteMigrated = !!localStorage.getItem("city-grid-v3-white");
    } catch (e) {}
    if (!whiteMigrated) {
        el("bgw").checked = true;
        el("pc").value = "#222222";
        try {
            localStorage.setItem("city-grid-v3-white", "1");
        } catch (e) {}
    }
    // 旧版の初期値2.5pxを、今回の標準1.5pxへ一度だけ移行する。
    let lineWidthMigrated = false;
    try {
        lineWidthMigrated = !!localStorage.getItem("city-grid-v6-line-width");
    } catch (e) {}
    if (!lineWidthMigrated) {
        if (Math.abs(Number(P.pw) - 2.5) < 1e-6) P.pw = MASTER_W;
        const pwEl = el("pw");
        if (pwEl) pwEl.value = P.pw;
        sync();
        try {
            localStorage.setItem("city-grid-v6-line-width", "1");
        } catch (e) {}
    }
    let lensDefaultMigrated = false;
    try {
        lensDefaultMigrated = !!localStorage.getItem("city-grid-v7-lens-50");
    } catch (e) {}
    if (!lensDefaultMigrated) {
        if (Math.abs(Number(P.lens) - 35) < 1e-6) P.lens = 50;
        sync();
        try {
            localStorage.setItem("city-grid-v7-lens-50", "1");
        } catch (e) {}
    }
    if (innerWidth <= 900 && !sidePref) setSide(true);
    window.cityGridStudioBridge = {
        el,
        stage,
        setStudioWorkspace,
        validStroke,
        sanitizeScene,
        fitFloorPlan,
        syncFloorPlanDockLayout,
        sceneObjects,
        syncAssetAxis: () => syncAssetAxis(),
    };
    if (window.cityGridInstallAssetUI) window.cityGridInstallAssetUI(window.cityGridStudioBridge);
    updateOutliner();
    render();
})();

</script>
