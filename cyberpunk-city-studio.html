<!doctype html>
<html lang="ja">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
        <title>パース定規グリッド（視点設定＋定規描画）</title>
        <style>
            :root {
                --bg: #141513;
                --pn: #1e201d;
                --tx: #e8e8e2;
                --mu: #9a9c92;
                --ac: #e8a33d;
                --bd: #34372f;
            }
            @media (prefers-color-scheme: light) {
                :root {
                    --bg: #eceae4;
                    --pn: #fff;
                    --tx: #222;
                    --mu: #666;
                    --bd: #d0cec6;
                }
            }
            * {
                box-sizing: border-box;
            }
            html,
            body {
                height: 100%;
                margin: 0;
            }
            body {
                background: var(--bg);
                color: var(--tx);
                font:
                    13px/1.5 system-ui,
                    "Hiragino Sans",
                    "Noto Sans JP",
                    sans-serif;
                display: flex;
                padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
                    env(safe-area-inset-left);
            }
            #side {
                width: 340px;
                overflow-y: auto;
                background: var(--pn);
                border-right: 1px solid var(--bd);
                padding: 10px;
            }
            #side.hide {
                display: none;
            }
            #main {
                flex: 1;
                min-width: 0;
                display: flex;
                flex-direction: column;
                -webkit-user-select: none;
                user-select: none;
                -webkit-touch-callout: none;
            }
            #bar {
                display: flex;
                gap: 6px;
                padding: 8px;
                flex-wrap: wrap;
                align-items: center;
            }
            #stage {
                flex: 1;
                min-height: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 6px;
            }
            canvas {
                touch-action: none;
                box-shadow: 0 0 0 1px var(--bd);
            }
            button,
            select,
            input[type="number"] {
                background: var(--pn);
                color: var(--tx);
                border: 1px solid var(--bd);
                border-radius: 6px;
                padding: 5px 9px;
                font: inherit;
            }
            button.on {
                background: var(--ac);
                color: #111;
                border-color: var(--ac);
            }
            h3 {
                margin: 12px 0 4px;
                font-size: 12px;
                color: var(--ac);
            }
            details {
                border-bottom: 1px solid var(--bd);
                padding: 0 0 4px;
            }
            summary {
                cursor: pointer;
                font-size: 13px;
                font-weight: 600;
                color: var(--ac);
                padding: 10px 2px;
                list-style: none;
                -webkit-user-select: none;
                user-select: none;
            }
            summary::-webkit-details-marker {
                display: none;
            }
            summary::before {
                content: "▸ ";
            }
            details[open] > summary::before {
                content: "▾ ";
            }
            .secbar {
                display: flex;
                gap: 6px;
                margin-bottom: 4px;
            }
            #edgeTab {
                position: fixed;
                top: 45%;
                z-index: 5;
                width: 24px;
                height: 60px;
                padding: 0;
                border-radius: 0 10px 10px 0;
                opacity: 0.9;
            }
            @media (max-width: 800px) {
                #edgeTab {
                    display: none;
                }
            }
            label {
                display: flex;
                align-items: center;
                gap: 6px;
                margin: 3px 0;
            }
            label > span:first-child {
                width: 88px;
                flex: none;
                color: var(--mu);
            }
            input[type="range"] {
                flex: 1;
                min-width: 0;
            }
            /* 全ての数値設定で上下スピナーを残す。Safari/Chromiumの見た目差も吸収する。 */
            input[type="number"] {
                -webkit-appearance: auto;
                appearance: auto;
                -moz-appearance: number-input;
            }
            input[type="number"]::-webkit-inner-spin-button,
            input[type="number"]::-webkit-outer-spin-button {
                display: block;
                opacity: 1;
            }
            output {
                width: 58px;
                text-align: right;
            }
            .nv {
                width: 74px;
                flex: none;
                text-align: right;
            }
            .un {
                width: 24px;
                flex: none;
                color: var(--mu);
            }
            .note {
                color: var(--mu);
                font-size: 12px;
            }
            @media (max-width: 800px) {
                body {
                    flex-direction: column-reverse;
                }
                #side {
                    width: auto;
                    max-height: 42vh;
                    border-right: 0;
                    border-top: 1px solid var(--bd);
                }
            }
        </style>

        <style id="studio-ui">
            /* City Grid Studio styles. This file overrides the base styles above. */
            :root {
                --bg: #0a0f14;
                --panel: #121a21;
                --panel-2: #19232c;
                --panel-3: #202c36;
                --ink: #edf5f3;
                --muted: #8e9da4;
                --line: #2b3a43;
                --mint: #66e3c8;
                --violet: #ad9cff;
                --orange: #ff9f68;
                --danger: #ff718d;
                --shadow: 0 18px 50px rgba(0, 0, 0, 0.32);
            }
            html,
            body {
                background: var(--bg);
                color: var(--ink);
            }
            body {
                overflow: hidden;
                font-size: 14px;
                background: radial-gradient(1200px 800px at 75% 20%, #182530 0, #0a0f14 62%);
            }
            #side {
                width: 332px;
                min-width: 332px;
                padding: 14px 13px 30px;
                background: linear-gradient(180deg, rgba(18, 26, 33, 0.98), rgba(12, 18, 23, 0.98));
                border-right: 1px solid #26343d;
                box-shadow: 12px 0 35px rgba(0, 0, 0, 0.16);
                z-index: 10;
            }
            #side.hide {
                display: none;
            }
            #main {
                position: relative;
                background: linear-gradient(180deg, #101820 0%, #0b1116 100%);
            }
            #bar {
                min-height: 64px;
                padding: 10px 14px;
                gap: 8px;
                flex-wrap: nowrap;
                overflow-x: auto;
                white-space: nowrap;
                background: rgba(11, 17, 22, 0.88);
                border-bottom: 1px solid #26343d;
                backdrop-filter: blur(18px);
                -webkit-overflow-scrolling: touch;
                scrollbar-width: thin;
                z-index: 5;
            }
            #bar::-webkit-scrollbar {
                height: 4px;
            }
            #bar::-webkit-scrollbar-thumb {
                background: #334852;
                border-radius: 99px;
            }
            .brand {
                display: flex;
                align-items: center;
                gap: 9px;
                padding-right: 8px;
                margin-right: 2px;
                flex: none;
            }
            .brandMark {
                display: grid;
                place-items: center;
                width: 34px;
                height: 34px;
                border-radius: 11px;
                background: linear-gradient(135deg, var(--mint), #4a8cff);
                color: #081116;
                font-weight: 900;
                box-shadow: 0 0 22px rgba(102, 227, 200, 0.25);
            }
            .brandText {
                font-weight: 800;
                letter-spacing: 0.02em;
                line-height: 1.05;
            }
            .brandText small {
                display: block;
                color: var(--muted);
                font-weight: 500;
                font-size: 10px;
                margin-top: 3px;
            }
            .barGroup {
                display: flex;
                align-items: center;
                gap: 5px;
                flex: none;
            }
            .barGrow {
                flex: 1;
                min-width: 10px;
            }
            #bar button,
            .barGroup button {
                min-height: 36px;
                border: 1px solid #30414b;
                background: #17222a;
                color: #dce8e7;
                border-radius: 10px;
                padding: 7px 11px;
                font-size: 13px;
                white-space: nowrap;
                transition:
                    background 0.16s,
                    border-color 0.16s,
                    transform 0.16s;
            }
            .barGroup button:hover,
            #bar button:hover {
                background: #22323d;
                border-color: #4b6570;
            }
            .barGroup button:active,
            #bar button:active {
                transform: translateY(1px);
            }
            #bar button.on {
                background: linear-gradient(135deg, #67e0c6, #7dc9ff);
                border-color: #7de9d3;
                color: #071116;
                font-weight: 800;
                box-shadow: 0 4px 16px rgba(102, 227, 200, 0.18);
            }
            #tg {
                padding-inline: 10px !important;
            }
            .toolBtn.on {
                background: #3a2944 !important;
                border-color: #c2a4ff !important;
                color: #eadfff !important;
            }
            .iconBtn {
                font-size: 18px !important;
                padding-inline: 9px !important;
            }
            .toolIconButton {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 5px;
                min-width: 36px !important;
                padding-inline: 8px !important;
            }
            .toolIconButton svg {
                display: block;
                width: 18px;
                height: 18px;
                stroke: currentColor;
                fill: none;
                stroke-width: 1.9;
                stroke-linecap: round;
                stroke-linejoin: round;
            }
            .saveBtn {
                border-color: #527966 !important;
                color: #baffea !important;
            }
            .warnBtn {
                border-color: #754253 !important;
                color: #ffb1be !important;
            }
            #stage {
                position: relative;
                min-height: 0;
                padding: 16px;
                background: radial-gradient(900px 700px at 55% 38%, #182631 0%, #0d151c 68%, #091016 100%);
                overflow: hidden;
            }
            #stage:before {
                content: "";
                position: absolute;
                inset: 0;
                pointer-events: none;
                opacity: 0.14;
                background-image:
                    linear-gradient(rgba(112, 174, 180, 0.18) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(112, 174, 180, 0.18) 1px, transparent 1px);
                background-size: 32px 32px;
                mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.8), transparent 75%);
            }
            canvas {
                border: 1px solid #344650;
                border-radius: 13px;
                box-shadow:
                    0 18px 55px rgba(0, 0, 0, 0.4),
                    0 0 0 1px rgba(149, 223, 218, 0.05);
                position: relative;
                z-index: 1;
            }
            #hint {
                margin: 0 14px 10px !important;
                padding: 8px 12px !important;
                min-height: 34px;
                color: #b9c8c9 !important;
                background: rgba(18, 27, 34, 0.88);
                border: 1px solid #293c46;
                border-radius: 10px;
                font-size: 12px !important;
                box-shadow: 0 5px 20px rgba(0, 0, 0, 0.16);
            }
            #side h3 {
                margin: 18px 0 7px;
                color: var(--mint);
                font-size: 11px;
                letter-spacing: 0.08em;
                text-transform: none;
            }
            #side details {
                border-bottom: 1px solid #27353e;
                padding-bottom: 5px;
            }
            #side summary {
                padding: 11px 3px;
                color: #d9e8e5;
                font-size: 13px;
                letter-spacing: 0.02em;
            }
            #side summary::before {
                color: var(--mint);
            }
            #side label {
                margin: 5px 0;
                min-height: 28px;
            }
            #side label > span:first-child {
                color: #9fb0b4;
                width: 96px;
            }
            #side button,
            #side select,
            #side input[type="number"] {
                background: #18242c;
                border-color: #334750;
                color: #e6f0ee;
                border-radius: 8px;
            }
            #side input[type="range"] {
                accent-color: var(--mint);
            }
            #side input[type="color"] {
                height: 30px;
                border-radius: 8px;
                border: 1px solid #40535b;
                background: #1a252b;
            }
            #side output {
                color: var(--mint);
            }
            #side .note {
                color: #82949a;
                font-size: 11px;
            }
            #side .secbar {
                position: sticky;
                top: -14px;
                z-index: 2;
                margin: -14px -13px 4px;
                padding: 11px 13px 8px;
                background: rgba(15, 23, 29, 0.96);
                border-bottom: 1px solid #27353e;
            }
            #side .secbar button {
                font-size: 11px;
                padding: 5px 8px;
            }
            #studioQuick {
                margin: -2px 0 12px;
                padding: 12px;
                border: 1px solid #2b4249;
                border-radius: 13px;
                background: linear-gradient(145deg, rgba(32, 50, 57, 0.78), rgba(19, 30, 37, 0.84));
                box-shadow: 0 10px 25px rgba(0, 0, 0, 0.14);
            }
            #studioQuick h2 {
                font-size: 13px;
                margin: 0 0 3px;
                color: #f0fffb;
            }
            #studioQuick .quickSub {
                font-size: 11px;
                color: var(--muted);
                margin-bottom: 10px;
            }
            .workspaceTabs {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 5px;
                margin: 10px 0 9px;
                padding: 3px;
                border: 1px solid rgba(116, 180, 174, 0.25);
                border-radius: 10px;
                background: rgba(5, 14, 18, 0.25);
            }
            .workspaceTab {
                min-width: 0 !important;
                padding: 6px 4px !important;
                border: 0 !important;
                border-radius: 7px !important;
                background: transparent !important;
                color: #9bb3b2 !important;
                font-size: 11px !important;
            }
            .workspaceTab.active {
                background: linear-gradient(135deg, #285e5a, #315d86) !important;
                color: #effffb !important;
                box-shadow: 0 2px 9px rgba(0, 0, 0, 0.18);
            }
            .workspaceScreen[hidden] {
                display: none !important;
            }
            .screenLead {
                margin: 2px 0 8px;
                color: #d7e9e5;
                font-size: 11px;
                line-height: 1.45;
            }
            .screenLead small {
                display: block;
                color: #8ca5a5;
                font-size: 10px;
            }
            .poseButton.active {
                border-color: var(--mint) !important;
                background: #285e5a !important;
                color: #effffb !important;
            }
            .quickRow {
                display: flex;
                gap: 6px;
                flex-wrap: wrap;
            }
            .quickRow button {
                flex: 1;
                min-width: 0;
            }
            .quickRow .primary {
                background: linear-gradient(135deg, #285e5a, #315d86);
                border-color: #4baba0;
                color: #e8fffb;
            }
            .lensPresetRow {
                margin-top: 6px;
            }
            .lensPresetRow button {
                flex: 1 1 92px;
                font-size: 11px;
                padding: 6px 5px;
            }
            .quickField {
                display: grid;
                grid-template-columns: 1fr 88px 28px;
                align-items: center;
                gap: 7px;
                margin: 9px 0 10px;
                color: #adc0c0;
                font-size: 12px;
            }
            .quickField input,
            .quickField select {
                width: 100%;
                padding: 6px 7px;
            }
            .quickField em {
                font-style: normal;
                color: var(--mint);
            }
            .quickCheck {
                display: flex !important;
                align-items: center;
                gap: 7px;
                color: #b4c7c5 !important;
                font-size: 12px !important;
                margin: 2px 0 9px !important;
            }
            .quickCheck input {
                accent-color: var(--mint);
            }
            .floorTintBox {
                margin-top: 9px;
                padding: 8px 9px;
                border: 1px solid rgba(116, 180, 174, 0.2);
                border-radius: 9px;
                background: rgba(7, 16, 21, 0.18);
            }
            .floorTintBox .quickField {
                margin: 6px 0 2px;
            }
            .floorTintBox input[type="color"] {
                height: 26px;
                padding: 1px;
            }
            .floorTintBox output {
                width: auto;
                text-align: right;
                color: var(--mint);
                font-size: 11px;
            }
            .quickHint {
                margin-top: 9px;
                padding-top: 8px;
                border-top: 1px solid rgba(116, 180, 174, 0.16);
                font-size: 11px;
                color: #91a7aa;
                line-height: 1.55;
            }
            #primitiveQuickMenu {
                position: absolute;
                left: 50%;
                top: 50%;
                transform: translate(-50%, -50%);
                z-index: 25;
                display: none;
                width: min(330px, calc(100% - 28px));
                padding: 13px;
                border: 1px solid #4a7177;
                border-radius: 18px;
                background: rgba(10, 20, 26, 0.95);
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
                backdrop-filter: blur(18px);
                pointer-events: auto;
            }
            #primitiveQuickMenu.open {
                display: block;
            }
            .primitiveMenuTitle {
                margin-bottom: 9px;
                text-align: center;
                color: #eafffa;
                font-weight: 800;
                font-size: 12px;
            }
            .primitiveMenuSub {
                margin-top: 8px;
                text-align: center;
                color: #8fa8aa;
                font-size: 10px;
            }
            .primitiveMenuGrid {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 7px;
            }
            .primitiveCard {
                display: grid;
                place-items: center;
                gap: 3px;
                min-height: 62px;
                padding: 7px 4px;
                border: 1px solid #38555d !important;
                border-radius: 11px !important;
                background: #1a2c33 !important;
                color: #e7f7f3 !important;
                font-size: 11px !important;
            }
            .primitiveCard:hover,
            .primitiveCard:active {
                border-color: var(--mint) !important;
                background: #27454a !important;
            }
            .primitiveCard b {
                font-size: 22px;
                color: var(--mint);
                font-weight: 500;
            }
            .primitiveCard small {
                font-size: 10px;
                color: #b6c9c7;
            }
            #floorPlanDock {
                position: absolute;
                right: 18px;
                top: 18px;
                z-index: 24;
                display: none;
                width: min(500px, calc(100% - 36px));
                pointer-events: none;
            }
            .floorPlanDockInner {
                display: flex;
                align-items: center;
                gap: 7px;
                flex-wrap: wrap;
                padding: 8px 10px;
                border: 1px solid rgba(102, 227, 200, 0.55);
                border-radius: 13px;
                background: rgba(9, 20, 25, 0.92);
                box-shadow: 0 14px 35px rgba(0, 0, 0, 0.42);
                backdrop-filter: blur(14px);
                pointer-events: auto;
            }
            .floorPlanDockHeader {
                display: flex;
                align-items: flex-start;
                gap: 8px;
                flex: 1 1 100%;
                min-width: 0;
            }
            .floorPlanDockStatus {
                flex: 1;
                min-width: 0;
                color: #effffb;
                font-size: 11px;
                line-height: 1.3;
            }
            .floorPlanDockStatus small {
                display: block;
                color: #9eb6b4;
                font-size: 10px;
            }
            .floorHistoryButtons {
                display: flex;
                gap: 4px;
                flex: none;
            }
            .floorHistoryButton {
                min-width: 36px !important;
                padding: 5px 7px !important;
            }
            .floorPlanPanTools {
                display: flex;
                align-items: center;
                gap: 4px;
                flex: 0 0 auto;
                color: #9eb1b1;
                font-size: 10px;
            }
            .floorPlanPanTools button {
                min-width: 34px !important;
                padding: 5px 6px !important;
            }
            .floorLensTools {
                display: flex;
                align-items: center;
                gap: 4px;
                flex: 0 0 auto;
                color: #9eb1b1;
                font-size: 10px;
            }
            .floorLensTools input {
                width: 56px !important;
                padding: 5px 6px !important;
                border: 1px solid #4b7779;
                border-radius: 6px;
                background: #0d1b21;
                color: #effffb;
                font-size: 11px;
            }
            #floorPlanDock button {
                min-width: 62px;
                padding: 6px 8px !important;
                font-size: 11px !important;
            }
            #floorPlanDock button:disabled {
                opacity: 0.42;
                cursor: default;
            }
            #floorPlanDock .dockCollapse {
                flex: none;
                min-width: 34px !important;
                padding: 4px 8px !important;
                color: #baffea !important;
                border-color: #4b7779 !important;
            }
            #floorPlanDock .dockHint {
                flex: 1 1 220px;
                color: #9eb1b1;
                font-size: 10px;
                line-height: 1.3;
            }
            #floorPlanDock.collapsed {
                width: auto;
                right: 18px;
            }
            #floorPlanDock.collapsed .floorPlanDockInner {
                padding: 6px 8px;
                flex-wrap: nowrap;
            }
            #floorPlanDock.collapsed .floorPlanDockHeader {
                flex: 0 0 auto;
            }
            #floorPlanDock.collapsed .floorPlanDockStatus,
            #floorPlanDock.collapsed .dockHint,
            #floorPlanDock.collapsed .floorPlanPanTools,
            #floorPlanDock.collapsed .floorLensTools,
            #floorPlanDock.collapsed [data-floor-dock-action]:not([data-floor-dock-action="collapse"]) {
                display: none;
            }
            #floorPlanDock.collapsed .dockCollapse {
                min-width: 88px !important;
            }
            #floorPlanDock.open {
                display: block;
            }
            #objectList {
                margin-top: 9px;
                max-height: 190px;
                overflow: auto;
                display: grid;
                gap: 5px;
            }
            .objectRow {
                display: flex;
                align-items: center;
                gap: 7px;
                width: 100%;
                text-align: left;
                padding: 7px 8px !important;
                background: #152027 !important;
                border: 1px solid #293b44 !important;
                border-radius: 8px !important;
                font-size: 12px !important;
                cursor: pointer;
            }
            .objectRow:hover {
                border-color: #5c9b95 !important;
            }
            .objectRow.selected {
                border-color: var(--orange) !important;
                background: #382b27 !important;
            }
            .objectRow.activeObject {
                box-shadow: inset 3px 0 0 var(--mint) !important;
            }
            .objectCheck {
                flex: none;
                width: 15px;
                height: 15px;
                accent-color: var(--mint);
            }
            .objectVisibility {
                flex: none;
                width: 22px;
                height: 22px;
                padding: 0 !important;
                border: 0 !important;
                background: transparent !important;
                color: var(--mint) !important;
                font-size: 15px !important;
                line-height: 1;
                opacity: 0.9;
            }
            .objectVisibility:hover {
                color: #fff !important;
            }
            .objectRow.hiddenObject {
                opacity: 0.55;

        <script id="engine">
/* City Grid Studio engine core.
   アプリ全体で共有する状態・座標計算・投影・基本図形・選択を担当する。

   主な流れ
   1. P / S にカメラ設定と線画・オブジェクト定義を保持する
   2. cam / scr / orthPoint でワールド座標を画面へ投影する
   3. genShape で基本図形の線画を生成する
   4. setOb / regenObjects で定義変更と線画再生成を行う
   5. 保存・読込は末尾のpack / unpack系から呼び出す

   アセット固有の線画は asset.js、ギズモ・ドラッグ・描画は engine-tools.js、
   パネルと間取りUIは studio-ui.js に分離している。 */
const $ = (id) => document.getElementById(id);
function isStackedBuildingAsset(o) {
    return o?.type === "asset" && ["stackedBuilding", "beveledStackedBuilding"].includes(o.asset);
}
function isBeveledStackedBuildingAsset(o) {
    return o?.type === "asset" && o.asset === "beveledStackedBuilding";
}
function stackedOpeningEnabled(o) {
    return !!(o && isStackedBuildingAsset(o) && (o.openingEnabled === true || o.opening === true));
}
const cv = $("cv"),
    ctx = cv.getContext("2d");
let W = 1600,
    H = 900; // キャンバスの内部サイズ（比率変更でHが変わる）

// ===== パラメータ（初期値の水平回転は参考サイトのy=39.912） =====
const MASTER_W = 1.5;
// P: カメラ、投影、描画設定をまとめたアプリ全体のパラメータ。
// UIから変更された値は sync() でHTMLの入力欄と同期する。
const P = {
    lens: 50,
    yaw: 39.912,
    hz: 50,
    pitch: 0,
    fov: 180,
    roll: 0,
    n: 48,
    ga: 0.45,
    gw: 0.7,
    pw: MASTER_W,
    pa: 0.5,
    ew: 24,

// ===== 見出しごとに折りたためるようにする（開閉の状態は覚える） =====
(function () {
    const side = $("side"),
        kids = [...side.children],
        closedDef = [
            "グリッドの種類",
            "カメラ",
            "補助線",
            "ペン",
            "編集・スナップ",
            "書き出し範囲",
            "消しゴム",
            "参考写真",
            "保存",
            "読み取り",
        ];
    let st = {},
        det = null;
    try {
        if (localStorage.getItem("city-grid-ui-compact-v1") !== "1") {
            localStorage.removeItem("pgrid-sec");
            localStorage.setItem("city-grid-ui-compact-v1", "1");
        }
        st = JSON.parse(localStorage.getItem("pgrid-sec") || "{}");
    } catch (e) {}
    side.innerHTML =
        '<div class="secbar"><button id=secC>すべて閉じる</button><button id=secO>すべて開く</button></div>';
    kids.forEach((k) => {
        if (k.tagName === "H3") {
            const name = k.textContent.replace(/（.*）/, ""),
                d = document.createElement("details"),
                sm = document.createElement("summary"); // かっこ書きは除いた名前で状態を覚える
            d.open = name in st ? st[name] : !closedDef.includes(name);
            sm.textContent = k.textContent;
            d.appendChild(sm);
            side.appendChild(d);
            d.ontoggle = () => {
                st[name] = d.open;
                try {
                    localStorage.setItem("pgrid-sec", JSON.stringify(st));
                } catch (e) {}
            };
            det = d;
        } else if (det) det.appendChild(k);
        else side.appendChild(k);
    });
    $("secC").onclick = () => side.querySelectorAll("details").forEach((d) => (d.open = false));
    $("secO").onclick = () => side.querySelectorAll("details").forEach((d) => (d.open = true));
})();

// 画面上の入力欄からPへ値を反映し、表示を更新する共通入口。
function sync() {
    for (const k in P) {
        const el = $("v_" + k);
        if (el && document.activeElement !== el && typeof P[k] === "number") el.value = +(+P[k]).toFixed(3);
    }
    syncSurfaceToggle();
    if (typeof syncExportLineWidth === "function") syncExportLineWidth();
} // 入力中の欄は上書きしない
function syncSurfaceToggle() {
    const b = $("surfaceToggle");
    if (!b) return;
    b.textContent = P.surfaceMode ? "面 ON" : "面 OFF";
    b.classList.toggle("on", !!P.surfaceMode);
    b.title = P.surfaceMode
        ? "画像全体：面表示ON／背面処理ON（クリックでOFF）"
        : "画像全体：面表示OFF（クリックで面表示＋背面処理）";
}
$("surfaceToggle").onclick = () => {
    P.surfaceMode = !P.surfaceMode;
    syncSurfaceToggle();

        tau = Math.max(0.04, Number(ed.tau) || 0.04),
        tol = Math.max(0.01, tau * 0.25);
    let best = null;
    ed.targets.forEach((t) => {
        const to = obOf(t.id),
            pts = snapObjectCorners(to);
        if (pts.length < 2) return;
        const proj = pts.map((p) => ({ n: dot3(p, n), t: tangents.map((a) => dot3(p, a)) }));
        const nMin = Math.min(...proj.map((p) => p.n)),
            nMax = Math.max(...proj.map((p) => p.n));
        for (let k = 0; k < 2; k++) {
            const tMin = Math.min(...proj.map((p) => p.t[k])),
                tMax = Math.max(...proj.map((p) => p.t[k])),
                fMin = faceT[k] - halves[k],
                fMax = faceT[k] + halves[k];
            if (Math.min(fMax, tMax) - Math.max(fMin, tMin) < -tol) return;
        }
        // 対象の下端・上端の両方を候補にする。面の接線方向が重なり、
        // かつ吸着距離内にある辺だけを通すので、遠い対象へは飛ばない。
        const candidates = [nMin, nMax];
        candidates.forEach((targetN) => {
            const gap = targetN - faceN;
            if (Math.abs(gap) <= tau && (!best || Math.abs(gap) < Math.abs(best.gap)))
                best = { gap, id: t.id, targetN };
        });
    });
    if (!best) return dl;
    snapHit = new Set([best.id]);
    // dlは編集面そのものの移動量なので、対象面との差を加えるだけでよい。
    return dl + (best.targetN - faceN);
}

function beginGizmo(h, p) {
    const o = h.g.o,
        r = unscr(p),
        co = CO(),
        group = o.attachment?.verticalOnly ? [o] : selectedObjects(),
        base = {
            id: o.id,
            o0: o.type === "compound" ? JSON.parse(JSON.stringify(o)) : { ...o },
            group: group.map((q) => ({ ...q, off: [...(q.off || [0, 0, 0])] })),
            started: false,
            ...(group.length > 1 ? snapSetupGroup(group, h.g.C3) : snapSetup(o, h.g.C3)),
        };
    if (h.t === "stack-floor") {
        const index = stackedIndividualEdit(o)
                ? clamp(Math.round(Number(h.floorIndex) || 0), 0, Math.max(0, (o.floors || []).length - 1))
                : 0,
            f = o.floors?.[index],
            q = stackedFloorScreen(o, index);
        if (f && q) {
            const zmid = (Number(f.z) || 0) + (Number(f.h) || 2.2) * 0.5,
                c = scrW(customPt(o, Number(f.x) || 0, Number(f.y) || 0, zmid)),
                bx = scrW(customPt(o, (Number(f.x) || 0) + 1, Number(f.y) || 0, zmid)),
                by = scrW(customPt(o, Number(f.x) || 0, (Number(f.y) || 0) + 1, zmid));
            setOb(o.id, { activeFloor: index });
            ed = {
                ...base,
                o0: { ...o, floors: (o.floors || []).map((floor) => ({ ...floor })) },
                t: "stack-floor-mv",
                floorIndex: index,
                p0: p,
                stackMove: {
                    x: Number(f.x) || 0,
                    y: Number(f.y) || 0,
                    bx: { x: (bx?.x || c.x) - c.x, y: (bx?.y || c.y) - c.y },
                    by: { x: (by?.x || c.x) - c.x, y: (by?.y || c.y) - c.y },
                },
            };
        }
    } else if (h.t === "wallSideSign-face") {
        const F0 = V.add(h.f.P3, co),
            t0 = lineParam(r, F0, h.f.n),
            faceGuide = faceScreenGuide(h.f);
        if (t0 != null || faceGuide)
            ed = {
                ...base,
                t: h.t,
                fid: h.f.id,
                n: h.f.n,
                F0,
                Fa: h.f.P3,
                t0,
                faceGuide,
                p0: p,
            };
    } else if (
        h.t.startsWith("sign-") ||
        h.t.startsWith("building-") ||
        h.t.startsWith("awning-") ||
        h.t.startsWith("stacked-") ||
        h.t === "stacked-bevel-offset" ||
        h.t.startsWith("path-point-") ||
        h.t === "path-radius" ||
        h.t === "beveled-offset" ||
        h.t === "wallSideSign-beveled-offset" ||
        h.t === "wallSideSign-bracket-length" ||
        h.t === "cone-height" ||
        h.t === "sphere-radius"
    )
        ed = { ...base, t: h.t, sign: h.sign, p0: p };
    else if (h.t === "axis") {
        const C0 = V.add(h.g.C3, co),
            t0 = lineParam(r, C0, h.a.a),
            axisGuide = faceScreenGuide({ P3: h.g.C3, n: h.a.a });
        if (t0 != null || axisGuide)
            ed = { ...base, t: "axis", a: h.a.a, aj: h.a.a.indexOf(1), C0, t0, axisGuide, p0: p };
    } else if (h.t === "face") {
        const F0 = V.add(h.f.P3, co),
            t0 = lineParam(r, F0, h.f.n),
            faceGuide = faceScreenGuide(h.f);
        // 画面方向を基準にすると、ドラッグした側と反対へ拡大する跳ね返りを防げる。
        // guideがつぶれるビューでは、t0だけで不安定に動かさない。
        if (t0 != null || faceGuide) {
            const fj = [0, 1, 2].find((j) => Math.abs(h.f.n[j]) > 0.999);
            ed = {
                ...base,
                t: "face",
                fid: h.f.id,
                n: h.f.n,
                F0,
                Fa: h.f.P3,
                fj: fj === undefined ? -1 : fj,
                t0,
                faceGuide,
                p0: p,
            };
        }
    } else if (o.type === "compound")
        ed = { ...base, t: "ring", sC: h.g.sC, ang0: Math.atan2(p.y - h.g.sC.y, p.x - h.g.sC.x) };
    else {
        const dd = o.d - o.d * o.lift,
            P1 = hit3(r, o.k, dd, cloc(o)),
            [iu, iv] = PL[o.k];
        if (P1) ed = { ...base, t: "ring", dd, ang0: Math.atan2(P1[iv] - o.cb, P1[iu] - o.ca) };
    }
}
// キャンバス上のドラッグで編集（ed=いまの編集操作）。磁石スナップがONなら他の図形・地面にくっつく
function dragEdit(p, freeRotation = false) {
    const o = ed.o0,
        [iu, iv] = PL[o.k],
        r = unscr(p),
        on = $("snp").checked;
    let patch = null;
    snapHit = null;
    const snap = (delta, axes) => {
        if (!on) return delta;
        const q = snapShift(ed.bb, delta, axes, ed.targets, ed.tau);
        if (q.hit.size) snapHit = q.hit;
        return q.d;
    };
    if (ed.t.startsWith("path-point-")) {
        const h = ed.sign,
            deltaX = p.x - ed.p0.x,
            deltaY = p.y - ed.p0.y,
            amount = (deltaX * h.dir.x + deltaY * h.dir.y) / (h.scale || 1),
            path = pathPipeControlPoints(o).map((point) => [...point]);
        if (path[h.index]) {
            path[h.index][h.axis] = clamp(h.start + amount, h.min, h.max);
            patch = { path };
        }
    } else if (ed.t === "path-radius") {
        const h = ed.sign,
            deltaX = p.x - ed.p0.x,
            deltaY = p.y - ed.p0.y,
            radius = clamp(h.start + (deltaX * h.dir.x + deltaY * h.dir.y) / (h.scale || 1), h.min, h.max);
        patch = { pipeRadius: radius };
    } else if (ed.t === "beveled-offset") {
        const h = ed.sign,
            deltaX = p.x - ed.p0.x,
            deltaY = p.y - ed.p0.y,
            offset = clamp(h.start + (deltaX * h.dir.x + deltaY * h.dir.y) / (h.scale || 1), h.min, h.max);
        patch = { bevelOffset: offset };
    } else if (ed.t === "wallSideSign-bracket-length") {
        const h = ed.sign,
            deltaX = p.x - ed.p0.x,
            deltaY = p.y - ed.p0.y,
            length = clamp(h.start + (deltaX * h.dir.x + deltaY * h.dir.y) / (h.scale || 1), h.min, h.max);
        patch = { wallSideSignBracketLength: length };
    } else if (ed.t === "wallSideSign-beveled-offset") {
        const h = ed.sign,
            deltaX = p.x - ed.p0.x,
            deltaY = p.y - ed.p0.y,
            offset = clamp(h.start + (deltaX * h.dir.x + deltaY * h.dir.y) / (h.scale || 1), h.min, h.max);
        patch = {
            wallSideSignShape: offset > 0.0001 ? "beveled" : "box",
            wallSideSignBevelOffset: offset,
            wallSideSignBevelSegments: 4,
        };
    } else if (ed.t.startsWith("building-")) {
        const h = ed.sign,
            deltaX = p.x - ed.p0.x,
            deltaY = p.y - ed.p0.y,
            amount = (deltaX * h.dir.x + deltaY * h.dir.y) / (h.scale || 1);
        if (ed.t === "building-backFace")
            patch = { openingBack: clamp(h.start + (h.factor || 1) * amount, h.min, h.max) };
        else if (ed.t.includes("OpeningH")) patch = { openingH: clamp(h.start + amount, h.min, h.max) };
        else patch = { openingW: clamp(h.start + (h.factor || 1) * amount, h.min, h.max) };
    } else if (ed.t === "stack-floor-mv") {
        const h = ed.stackMove,
            dx = p.x - ed.p0.x,
            dy = p.y - ed.p0.y,
            det = h.bx.x * h.by.y - h.bx.y * h.by.x;
        let mx = 0,
            my = 0;
        if (Math.abs(det) > 1e-6) {
            mx = (dx * h.by.y - dy * h.by.x) / det;
            my = (h.bx.x * dy - h.bx.y * dx) / det;
        } else if (Math.hypot(h.bx.x, h.bx.y) >= Math.hypot(h.by.x, h.by.y)) {
            const n = Math.hypot(h.bx.x, h.bx.y) || 1;
            mx = (dx * h.bx.x + dy * h.bx.y) / (n * n);
        } else {
            const n = Math.hypot(h.by.x, h.by.y) || 1;
            my = (dx * h.by.x + dy * h.by.y) / (n * n);
        }
        const floors = Array.isArray(o.floors) ? o.floors.map((f) => ({ ...f })) : [],
            floor = floors[ed.floorIndex],
            individual = stackedIndividualEdit(o);
        if (floor) {
            let nextX = h.x + mx,
                nextY = h.y + my;
            if (!individual && $("snp")?.checked) {
                // ローカル階座標をワールドX/Zの移動量へ変換してから吸着する。
                // そのまま画面量だけを補正すると、回転した建物では別方向へずれる。
                const a = Number(o.rot || 0) * DG,
                    cs = Math.cos(a),
                    sn = Math.sin(a),
                    raw = [
                        (nextX - (Number(floor.x) || 0)) * cs - (nextY - (Number(floor.y) || 0)) * sn,
                        0,
                        (nextX - (Number(floor.x) || 0)) * sn + (nextY - (Number(floor.y) || 0)) * cs,
                    ],
                    q = snapShift(ed.bb, raw, [0, 2], ed.targets, ed.tau);
                snapHit = q.hit.size ? q.hit : null;
                nextX = (Number(floor.x) || 0) + q.d[0] * cs + q.d[2] * sn;
                nextY = (Number(floor.y) || 0) - q.d[0] * sn + q.d[2] * cs;
            }
            if (individual) {
                floor.x = nextX;
                floor.y = nextY;
                patch = {
                    floors,
                    activeFloor: ed.floorIndex,
                    h: (Number(floors[floors.length - 1]?.z) || 0) + (Number(floors[floors.length - 1]?.h) || 0),
                };
            } else {
                // 通常モードの1F移動は階のx/yではなく建物本体を移動する。
                // これで全階が同じ量だけ動き、3Dの回転リングも移動後の
                // 建物中心へ追従する。
                const dx = nextX - (Number(floor.x) || 0),
                    dy = nextY - (Number(floor.y) || 0),
                    a = Number(o.rot || 0) * DG,
                    cs = Math.cos(a),
                    sn = Math.sin(a);
                patch = {
                    ca: (Number(o.ca) || 0) + dx * cs - dy * sn,
                    cb: (Number(o.cb) || 0) + dx * sn + dy * cs,
                    activeFloor: 0,
                    h: (Number(floors[floors.length - 1]?.z) || 0) + (Number(floors[floors.length - 1]?.h) || 0),
                };
            }
        }
    } else if (ed.t === "stacked-bevel-offset") {
        const h = ed.sign,
            deltaX = p.x - ed.p0.x,
            deltaY = p.y - ed.p0.y,
            floors = Array.isArray(o.floors) ? o.floors.map((f) => ({ ...f })) : [],
            floor = floors[h.floorIndex],
            offset = clamp(h.start + (deltaX * h.dir.x + deltaY * h.dir.y) / (h.scale || 1), h.min, h.max);
        if (floor) {
            floor.bevelOffset = offset;
            if (!stackedIndividualEdit(o) && h.floorIndex === 0) floors.forEach((f) => (f.bevelOffset = offset));
            const last = floors[floors.length - 1];
            patch = {
                floors,
                bevelOffset: offset,
                floorCount: floors.length,
                h: (Number(last?.z) || 0) + (Number(last?.h) || 0),
            };
        }
    } else if (ed.t.startsWith("stacked-opening-")) {
        const h = ed.sign,
            deltaX = p.x - ed.p0.x,
            deltaY = p.y - ed.p0.y,
            amount = (deltaX * h.dir.x + deltaY * h.dir.y) / (h.scale || 1),
            value = clamp(h.start + (h.factor || 1) * amount, h.min, h.max);
        patch =
            ed.t === "stacked-opening-w-left" || ed.t === "stacked-opening-w-right"
                ? { openingW: value }
                : ed.t === "stacked-opening-h"
                  ? { openingH: value }
                  : { openingBack: value };
    } else if (ed.t.startsWith("stacked-")) {
        const h = ed.sign,
            deltaX = p.x - ed.p0.x,
            deltaY = p.y - ed.p0.y,
            amount = (deltaX * h.dir.x + deltaY * h.dir.y) / (h.scale || 1),
            floors = Array.isArray(o.floors) ? o.floors.map((f) => ({ ...f })) : [],
            floor = floors[h.floorIndex];
        if (floor) {
            const key = h.axis === "w" ? "w" : h.axis === "d" ? "d" : "h";
            floor[key] = clamp(h.start + amount, h.min, h.max);
            if (!stackedIndividualEdit(o) && h.floorIndex === 0 && ["w", "d", "h"].includes(key))
                floors.forEach((f) => (f[key] = floor[key]));
            const last = floors[floors.length - 1];
            patch = { floors, floorCount: floors.length, h: (Number(last?.z) || 0) + (Number(last?.h) || 0) };
        }
    } else if (ed.t === "awning-edgeZ") {
        const h = ed.sign,
            deltaX = p.x - ed.p0.x,
            deltaY = p.y - ed.p0.y,
            amount = (deltaX * h.dir.x + deltaY * h.dir.y) / (h.scale || 1);
        patch = {
            awningEdgeZ: clamp(h.start + amount, h.min, h.max),
            awningFrontBottom: h.frontBottom,
            awningEdgeEdited: true,
        };
    } else if (ed.t === "awning-edgeY") {
        const h = ed.sign,
            deltaX = p.x - ed.p0.x,
            deltaY = p.y - ed.p0.y,
            amount = (deltaX * h.dir.x + deltaY * h.dir.y) / (h.scale || 1);
        patch = { awningEdgeY: clamp(h.start + amount, h.min, h.max), awningEdgeEdited: true };
    } else if (ed.t === "sign-faceW" || ed.t === "sign-faceH") {
        const h = ed.sign,
            deltaX = p.x - ed.p0.x,
            deltaY = p.y - ed.p0.y,
            amount = (deltaX * h.dir.x + deltaY * h.dir.y) / (h.scale || 1);
        const min = h.min,
            max = h.max,
            v = clamp(h.start + amount, min, max);
        patch = { [ed.t === "sign-faceW" ? "faceW" : "faceH"]: v };
    } else if (ed.t === "cone-height") {
        const h = ed.sign,
            deltaX = p.x - ed.p0.x,
            deltaY = p.y - ed.p0.y,
            v = clamp(h.start + (deltaX * h.dir.x + deltaY * h.dir.y) / (h.scale || 1), h.min, h.max);
        patch = { h: v };
    } else if (ed.t === "sphere-radius") {
        const h = ed.sign,
            deltaX = p.x - ed.p0.x,
            deltaY = p.y - ed.p0.y,
            radius = clamp(h.start + (deltaX * h.dir.x + deltaY * h.dir.y) / (h.scale || 1), h.min, h.max);
        patch = { ra: radius, rb: radius, h: radius * 2 };
    } else if (ed.t === "mv") {
        // 間取りモードは表示面内を移動させる。高さ・接地状態は専用の
        // 正面／横ギズモで編集し、生成面がX/Zでも位置移動を止めない。
        const floorMove = !!window.cityFloorPlanActive,
            plane = floorMove && o.k === 1 ? -1 : o.d - o.d * o.lift;
        const P1 = hit3(r, o.k, plane, cloc(o)); // 線をドラッグ＝面の上で移動
        if (P1 && ed.P0) {
            const dl = [0, 0, 0];
            dl[iu] = P1[iu] - ed.P0[iu];
            dl[iv] = P1[iv] - ed.P0[iv];
            const q = snap(dl, [iu, iv]);
            // 複数選択時は主役のドラッグ量をワールド移動量として全員へ同じように適用する。
            if (ed.group && ed.group.length > 1) {
                ed.moveDelta = [q[0], q[1], q[2]];
                patch = moveBy(o, ed.moveDelta);
            } else patch = moveBy(o, q); /* 間取りではca/cbだけを変え、Y方向のliftとoffは保持する。 */
        }
    } else if (ed.t === "axis") {
        let amount = null;
        if (ed.axisGuide?.hidden) amount = 0;
        else if (ed.axisGuide) {
            const dx = p.x - ed.p0.x,
                dy = p.y - ed.p0.y;
            amount = (dx * ed.axisGuide.dir.x + dy * ed.axisGuide.dir.y) / (ed.axisGuide.scale || 1);
        } else {
            const t = lineParam(r, ed.C0, ed.a);
            if (t != null && ed.t0 != null) amount = t - ed.t0;
        }
        if (amount != null) {
            // 壁横看板の前後軸はワールドX/Zの単一軸ではないため、
            // 回転した建物でも軸方向を保ち、通常のXYZ軸だけスナップする。
            const snapAxes = Number.isInteger(ed.aj) && ed.aj >= 0 ? [ed.aj] : [];
            ed.moveDelta = snap(
                ed.a.map((x) => x * amount),
                snapAxes,
            );
            patch = moveBy(o, ed.moveDelta);
        }
    } // 矢印＝その軸に沿って移動
    else if (ed.t === "wallSideSign-face") {
        let dl = null;
        if (ed.faceGuide?.hidden) dl = 0;
        else if (ed.faceGuide) {
            const dx = p.x - ed.p0.x,
                dy = p.y - ed.p0.y;
            dl = (dx * ed.faceGuide.dir.x + dy * ed.faceGuide.dir.y) / (ed.faceGuide.scale || 1);
        } else {
            const t = lineParam(r, ed.F0, ed.n);
            if (t != null && ed.t0 != null) dl = t - ed.t0;
        }
        if (dl != null) patch = wallSideSignFacePatch(o, ed.fid, dl);
    } else if (ed.t === "face") {
        let dl = null;
        if (ed.faceGuide?.hidden) dl = 0;
        else if (ed.faceGuide) {
            const dx = p.x - ed.p0.x,
                dy = p.y - ed.p0.y;
            dl = (dx * ed.faceGuide.dir.x + dy * ed.faceGuide.dir.y) / (ed.faceGuide.scale || 1);
        } else {
            const t = lineParam(r, ed.F0, ed.n);
            if (t != null && ed.t0 != null) dl = t - ed.t0;
        }
        if (dl != null) {
            const moved = o.type === "compound" ? dl : faceSnap(dl);
            patch =
                o.type === "compound"
                    ? compoundFacePatch(o, ed.fid, moved)
                    : o.type === "asset" && o.asset === "building"
                      ? buildingOuterFacePatch(o, ed.fid, moved)
                      : facePatch(o, ed.fid, moved);
        }
    } // 白い四角＝面の押し引き
    else if (ed.t === "ring") {
        if (o.type === "compound") {
            const raw = wrap180((Math.atan2(p.y - ed.sC.y, p.x - ed.sC.x) - ed.ang0) / DG),
                base = Number(o.compoundRot) || 0,
                target = freeRotation ? base + raw : Math.round((base + raw) / 15) * 15;
            patch = rotateCompoundBy(ed.o0 || o, target - base);
        } else {
            const P1 = hit3(r, o.k, ed.dd, cloc(o));
            if (P1) {
                const raw = (Math.atan2(P1[iv] - o.cb, P1[iu] - o.ca) - ed.ang0) / DG,
                    target = freeRotation ? Number(o.rot || 0) + raw : Math.round((Number(o.rot || 0) + raw) / 15) * 15;
                patch = { rot: wrap180(target) };
            }
        }
    } // 輪＝回転（通常15°吸着、Shiftで自由回転）
    if (!patch) return;
    if (!ed.started) {
        HU.push(S);
        RD = [];
        ed.started = true;
    }
    if ((ed.t === "mv" || ed.t === "axis") && ed.group && ed.group.length > 1 && ed.moveDelta) {
        // 初期スナップショットから再生成するので、ポインタ移動のたびに位置が累積しない。
        const ids = new Set(ed.group.map((g) => g.id));
        ed.group.forEach((g) => {
            const q = moveBy(g, ed.moveDelta, !!(g.attachment?.parentId && ids.has(g.attachment.parentId)));
            setOb(g.id, q);
        });
    } else setOb(ed.id, patch);
    render();
}

// ===== 書き出し範囲（ブレンダーのレンダー範囲のような枠） =====
function crect() {
    return {
        x: Math.min(CR.x0, CR.x1),
        y: Math.min(CR.y0, CR.y1),
        w: Math.abs(CR.x1 - CR.x0),
        h: Math.abs(CR.y1 - CR.y0),
    };
}
function overlay(c) {
    // 範囲の外を暗くして枠を表示（画面だけ。書き出しには入らない）
    if (!CR) return;
    const r = crect();
    c.save();
    c.fillStyle = "rgba(0,0,0,.45)";
    c.beginPath();

            [x, y, z0],
            [-x, y, z0],
            [-x, -y, z1],
            [x, -y, z1],
            [x, y, z1],
            [-x, y, z1],
        ];

        [0, 1, 2, 3],
        [4, 7, 6, 5],
        [0, 4, 5, 1],
        [1, 5, 6, 2],
        [2, 6, 7, 3],
        [3, 7, 4, 0],
    ];

        const a = q.map((i) => L2W(o, ...v[i]));

        <script id="studio-ui">

        polyA(

                toWorld = (q) => [q[0] + ox, q[1] + oy, q[2] + oz];
            // 面ごとに輪郭を足すと共有辺が2回描かれるため、箱の12辺を一度だけ描く。
            [
                ...(caps.bottom ? [[0, 1, 2, 3, 0]] : []),
                ...(caps.top ? [[4, 5, 6, 7, 4]] : []),
                [0, 4],
                [1, 5],
                [2, 6],
                [3, 7],
            ].forEach((edge) =>
                out.push(
                    customLineA(
                        o,
                        edge.map((i) => toWorld(v[i])),
                        color,
                    ),
                ),
            );
        };
        const addBeveledBox = (
            f,
            w,
            d,
            z,
            h,
            bevelOffset,
            bevelSegments,
            color = c,
            caps = { bottom: true, top: true },
        ) => {
            const footprint = beveledBoxFootprint(w, d, bevelOffset, bevelSegments),
                ox = Number(f.x || 0),
                oy = Number(f.y || 0),
                oz = Number(f.z || 0),
                bottom = footprint.map(([x, y]) => [x + ox, y + oy, z + oz]),
                top = footprint.map(([x, y]) => [x + ox, y + oy, z + h + oz]);
            if (caps.bottom) out.push(customLineA(o, [...bottom, bottom[0]], color));
            if (caps.top) out.push(customLineA(o, [...top, top[0]], color));
            footprint.forEach(([x, y]) =>
                out.push(
                    customLineA(
                        o,
                        [
                            [x + ox, y + oy, z + oz],
                            [x + ox, y + oy, z + h + oz],
                        ],
                        color,
                    ),
                ),
            );

        const openingEnabled = stackedOpeningEnabled(o);
        const addOpeningWire = (f, w, d, h, opening) => {
            const ox = Number(f.x || 0),
                oy = Number(f.y || 0),
                oz = Number(f.z || 0),
                near = -d * 0.5,
                far = d * 0.5,
                panelY = opening.openingBack,
                ow = opening.openingW,
                oh = opening.openingH,
                toWorld = (p) => [p[0] + ox, p[1] + oy, p[2] + oz],
                line = (points, color = a, width = 1.1) => out.push(customLineA(o, points.map(toWorld), color, width));
            // 開口を持つ1Fの外周・開口枠・内側底辺／奥面を、既存の開口建物と同じ順で描く。
            line([
                [-w / 2, near, h],
                [w / 2, near, h],
            ]);
            line([
                [-w / 2, far, h],
                [w / 2, far, h],
            ]);
            line([
                [-ow / 2, near, 0],
                [-ow / 2, near, oh],
                [ow / 2, near, oh],
                [ow / 2, near, 0],
            ]);
            line([
                [-ow / 2, far, 0],
                [-ow / 2, far, oh],
                [ow / 2, far, oh],
                [ow / 2, far, 0],
            ]);

                    [-ow / 2, panelY, 0],
                    [-ow / 2, panelY, oh],
                    [ow / 2, panelY, oh],
                    [ow / 2, panelY, 0],
                ]);
            // 開口の床面／奥面の下辺は省略しない。正面側と閉じた内壁側の両方へ描く。
            line(
                [
                    [-ow / 2, near, 0.012],
                    [ow / 2, near, 0.012],
                ],
                a,
                1.05,
            );
            line(
                [
                    [-ow / 2, panelY, 0.012],
                    [ow / 2, panelY, 0.012],
                ],
                a,
                1.15,
            );
            line(
                [
                    [-ow / 2, near, 0],
                    [-ow / 2, panelY, 0],
                    [-ow / 2, panelY, oh],
                    [-ow / 2, near, oh],
                    [-ow / 2, near, 0],
                ],
                a,
                1.0,
            );
            line(
                [
                    [ow / 2, near, 0],
                    [ow / 2, near, oh],
                    [ow / 2, panelY, oh],
                    [ow / 2, panelY, 0],
                    [ow / 2, near, 0],
                ],
                a,
                1.0,
            );
            line(
                [
                    [-ow / 2, near, oh],
                    [ow / 2, near, oh],
                    [ow / 2, panelY, oh],
                    [-ow / 2, panelY, oh],
                    [-ow / 2, near, oh],
                ],
                a,
                1.0,
            );
        };
        floors.forEach((f, i) => {
            const w = Math.max(0.05, Math.abs(Number(f.w) || Number(o.ra || 2) * 2)),
                d = Math.max(0.05, Math.abs(Number(f.d) || Number(o.rb || 1.5) * 2)),
                h = Math.max(0.05, Math.abs(Number(f.h) || 2.2)),
                opening = i === 0 && openingEnabled ? stackedOpeningParams(o, f) : null,
                rh = clamp(Math.abs(Number(f.rimHeight) || Number(o.rimHeight) || 0.16), 0.01, h),
                ro = Math.max(0, Math.abs(Number(f.rimOverhang) || Number(o.rimOverhang) || 0.18)),
                bevelOffset = Number.isFinite(Number(f.bevelOffset))
                    ? Number(f.bevelOffset)
                    : Number(o.bevelOffset) || 0.28,
                bevelSegments = beveledBoxSegments(
                    f.bevelSegments,
                    f.bevelEdges,
                    beveledBoxSegments(o.bevelSegments, o.bevelEdges),
                );
            // 本体の上辺は上側の縁に隠れるため描かず、下側の縁は全階で作らない。
            // 開口をONにした場合だけ、1F本体へ開口枠・内側面を追加する。
            if (kind === "beveledStackedBuilding") {
                addBeveledBox(f, w, d, 0, h, bevelOffset, bevelSegments, f.c || c, { bottom: i === 0, top: false });
                if (opening) addOpeningWire(f, w, d, h, opening);
                // 下側の縁は全階で作らず、各階の上側だけに縁を配置する。

            } else {
                addBox(f, w, d, 0, h, f.c || c, { bottom: i === 0, top: false });

        });

    } else if (kind === "balcony") {

        const floorT = clamp(Number(o.balconyFloorThickness) || 0.16, 0.04, Math.max(0.05, h * 0.7)),
            railH = clamp(Number(o.balconyRailHeight) || Math.max(0.18, h - floorT), 0.12, Math.max(0.12, h - 0.01)),
            railT = clamp(Number(o.balconyRailThickness) || 0.12, 0.035, Math.min(w, d) * 0.35),

            sideRail = o.balconySideRail !== false;

        if (sideRail) {

                lineA(
                    o,
                    [
                        [x, wallY, bracketZ],
                        [x, frontY, 0],
                    ],
                    c,
                    0.85,
                ),
            ),
        );

    } else if (kind === "stairs") {

            sd = d / n,
            sh = h / n;

        for (let i = 0; i < n; i++) {
            const y0 = -d / 2 + i * sd,
                y1 = y0 + sd,
                z = (i + 1) * sh,
                z0 = i * sh;
            out.push(
                polyA(
                    o,
                    [
                        [-w / 2, y0, z],
                        [w / 2, y0, z],
                        [w / 2, y1, z],
                        [-w / 2, y1, z],
                    ],
                    c,
                ),
            );

                lineA(
                    o,
                    [
                        [-w / 2, y0, z0],
                        [-w / 2, y0, z],
                        [w / 2, y0, z],
                    ],
                    a,
                    0.9,
                ),
            );
            out.push(
                lineA(
                    o,
                    [
                        [w / 2, y0, z0],
                        [w / 2, y0, z],
                    ],
                    a,
                    0.9,
                ),
            );
            out.push(
                lineA(
                    o,
                    [
                        [-w / 2, y0, z],
                        [-w / 2, y1, z],
                    ],
                    a,
                    0.9,
                ),
            );
            out.push(
                lineA(
                    o,
                    [
                        [w / 2, y0, z],
                        [w / 2, y1, z],
                    ],
                    a,
                    0.9,
                ),
            );

            polyA(
                o,
                [
                    [-w / 2, -d / 2, 0],
                    [w / 2, -d / 2, 0],
                    [w / 2, d / 2, 0],
                    [-w / 2, d / 2, 0],
                ],
                a,
                0.9,
            ),
        );

            lineA(
                o,
                [
                    [-w / 2, d / 2, 0],
                    [w / 2, d / 2, 0],
                    [w / 2, d / 2, h],

            });

        // 道路の面へ白いストライプを並べる。

                polyA(
                    o,
                    [
                        [-w / 2, y - stripeD / 2, 0.012],
                        [w / 2, y - stripeD / 2, 0.012],
                        [w / 2, y + stripeD / 2, 0.012],
                        [-w / 2, y + stripeD / 2, 0.012],

                    c,
                    1.1,
                ),

            lineA(
                o,
                [
                    [-w / 2, -d / 2, 0.014],
                    [w / 2, -d / 2, 0.014],
                ],
                a,
                0.9,
            ),
        );
        out.push(
            lineA(
                o,
                [
                    [-w / 2, d / 2, 0.014],
                    [w / 2, d / 2, 0.014],

                a,
                0.9,

    } else if (kind === "cylinder") {
        // 円柱は上下の輪郭だけ。側面の縦エッジは描かない。
        out.push(ringA(o, w * 0.5, d * 0.5, 0, 12, c));
        out.push(ringA(o, w * 0.5, d * 0.5, h, 12, c));
    } else if (kind === "cone") {

        const rx = w * 0.5,
            ry = d * 0.5,
            base = [];

            const t = (i / 16) * Math.PI * 2;
            base.push([rx * Math.cos(t), ry * Math.sin(t), 0]);

            rel = V.add(camPos(), cen, 1, -1),
            [iu, iv] = PL[o.k],
            cs = Math.cos(o.rot * DG),
            sn = Math.sin(o.rot * DG),
            eu = [0, 0, 0],
            ev = [0, 0, 0];
        eu[iu] = cs;
        eu[iv] = sn;
        ev[iu] = -sn;

                lineA(
                    o,
                    [

                    a,
                    1.0,
                ),

        ev[iv] = cs;

            y = d / 2,
            front = [
                [-x, -y, 0],
                [x, -y, 0],
                [0, -y, h],
            ],

                [-x, y, 0],
                [x, y, 0],
                [0, y, h],

        out.push(polyA(o, back, c));

    } else if (kind === "triPyramid") {

            y = d / 2,

                [-x, -y, 0],
                [x, -y, 0],
                [0, y, 0],

            apex = [0, 0, h];

        base.forEach((v) => out.push(lineA(o, [v, apex], a, 1.1)));

            body1 = 0.7 * h,
            rx = w * 0.48,
            ry = d * 0.48;

            out.push(
                lineA(
                    o,
                    [
                        [rx * Math.cos(t), ry * Math.sin(t), body0],
                        [rx * Math.cos(t), ry * Math.sin(t), body1],

                    c,
                ),

        for (let i = 0; i < 8; i++) {
            const t = (i / 8) * Math.PI * 2;
            out.push(
                lineA(
                    o,
                    [
                        [rx * Math.cos(t), ry * Math.sin(t), body1],
                        [rx * 0.82 * Math.cos(t), ry * 0.82 * Math.sin(t), 0.78 * h],
                    ],
                    a,
                    0.9,
                ),
            );
        }
        out.push(
            lineA(
                o,
                [
                    [0, 0, 0.78 * h],
                    [0, 0, 0.94 * h],
                ],
                a,
                1.3,
            ),
        );
        out.push(
            lineA(
                o,
                [
                    [0, 0, 0.94 * h],
                    [-0.1 * w, 0, h],
                    [0.1 * w, 0, h],
                    [0, 0, 0.94 * h],
                ],
                a,
                1.1,
            ),
        );
        // Two inner bands suggest a glowing paper lantern without requiring a texture.
        [0.36, 0.56].forEach((z) => out.push(ringA(o, rx * 1.02, ry * 1.02, z * h, 8, a, 0.8)));
        // --- 看板 ---
        // 外枠と、faceW / faceHで編集できる内側の絵枠を描く。
    } else if (kind === "sign") {

        const board0 = 0.08 * h,
            board1 = 0.82 * h,
            fy = signFaceDepth(o, 0.009);
        const faceW = Math.max(0.08, Math.min(Number(o.faceW) || w * 0.7, w * 0.9));
        const faceH = Math.max(0.08, Math.min(Number(o.faceH) || h * 0.34, (board1 - board0) * 0.84));

            [ix, fy, iz0],
            [ix, fy, iz1],
            [-ix, fy, iz1],

        // --- 人物 ---

    } else if (kind === "person") {

        // 腕は既存仕様どおり描かず、立体感は胴体・脚・頭の線だけで表現する。
        const bodyScale = clamp(Number(o.bodyScale) || 1, 0.6, 1.8),
            shoulderScale = clamp(Number(o.shoulderScale) || 1, 0.6, 1.6),
            headScale = clamp(Number(o.headScale) || 1, 0.7, 1.5),
            legSpread = clamp(Number(o.legSpread) || 1, 0.6, 1.8),

        const defaults = { stand: [0, 0, 0], walk: [0.22, 0, 0], crouch: [0.04, 0.65, 0], sit: [0.1, 0.35, 0] },
            def = defaults[pose] || defaults.stand;
        const stride = clamp(Number.isFinite(Number(o.poseStride)) ? Number(o.poseStride) : def[0], 0, 0.5),
            crouch = clamp(Number.isFinite(Number(o.poseCrouch)) ? Number(o.poseCrouch) : def[1], 0, 1),

            leg = 0.055 * h * bodyScale,
            headR = 0.095 * h * headScale;
        let legTop = (0.47 - 0.16 * crouch) * h,
            torso0 = (0.44 - 0.16 * crouch) * h,
            torso1 = (0.78 - 0.18 * crouch) * h,
            head0 = (0.84 - 0.18 * crouch) * h,
            head1 = (0.99 - 0.18 * crouch) * h,
            footY = [-stride, stride],

            kneeX = [-0.09 * h * legSpread, 0.09 * h * legSpread],
            poseTop = (1 - 0.18 * crouch) * h;
        const bodyY = lean * 0.18,
            headY = lean * 0.42,
            headTopX = Math.sin(headTilt * DG) * 0.06 * h;
        if (pose === "walk") {
            kneeY = [-0.05 * h, 0.06 * h];

        }
        if (pose === "crouch") {
            kneeY = [-0.06 * h, 0.06 * h];
            kneeX = [-0.1 * h * legSpread, 0.1 * h * legSpread];
        }
        if (pose === "sit") {
